syntax = "proto3";

package aperio.operations.v1;

import "aperio/operations/v1/operations.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/operations/v1/operationspbv1;operationspbv1";
option java_multiple_files = true;
option java_outer_classname = "OperationsMessagesProto";
option java_package = "engineering.shokki.aperio.operations.v1";

// Request message for GetServiceRequest.
message GetServiceRequestRequest {
  // The name of the service request to retrieve.
  // Format: venues/{venue}/serviceRequests/{service_request}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.operations.v1/ServiceRequest"
  ];
}

// Request message for ListServiceRequests.
message ListServiceRequestsRequest {
  // The parent whose service requests to list.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.operations.v1/ServiceRequest"
  ];

  // The maximum number of service requests to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListServiceRequests call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. department = DEPARTMENT_PANTRY AND state = STATE_OPEN.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListServiceRequests.
message ListServiceRequestsResponse {
  // The service requests.
  repeated ServiceRequest service_requests = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateServiceRequest.
message CreateServiceRequestRequest {
  // The parent the service request is created under.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.operations.v1/ServiceRequest"
  ];

  // The service request to create.
  ServiceRequest service_request = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string service_request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateServiceRequest.
message UpdateServiceRequestRequest {
  // The service request to update, by its name.
  ServiceRequest service_request = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DeleteServiceRequest.
message DeleteServiceRequestRequest {
  // The name of the service request to delete.
  // Format: venues/{venue}/serviceRequests/{service_request}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.operations.v1/ServiceRequest"
  ];

  // The etag the caller last read; the delete fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without deleting anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for AcknowledgeServiceRequest.
message AcknowledgeServiceRequestRequest {
  // The name of the service request to acknowledge.
  // Format: venues/{venue}/serviceRequests/{service_request}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.operations.v1/ServiceRequest"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for StartServiceRequest.
message StartServiceRequestRequest {
  // The name of the service request to start.
  // Format: venues/{venue}/serviceRequests/{service_request}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.operations.v1/ServiceRequest"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for CompleteServiceRequest.
message CompleteServiceRequestRequest {
  // The name of the service request to complete.
  // Format: venues/{venue}/serviceRequests/{service_request}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.operations.v1/ServiceRequest"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for CancelServiceRequest.
message CancelServiceRequestRequest {
  // The name of the service request to cancel.
  // Format: venues/{venue}/serviceRequests/{service_request}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.operations.v1/ServiceRequest"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Why, in the caller's words; kept on the service request.
  string reason = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 2000
  ];
}
