syntax = "proto3";

package aperio.booking.v1;

import "aperio/booking/v1/booking.proto";
import "aperio/booking/v1/booking_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "mcp/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/booking/v1/bookingpbv1;bookingpbv1";
option java_multiple_files = true;
option java_outer_classname = "BookingServiceProto";
option java_package = "engineering.shokki.aperio.booking.v1";

// BookingService: Stays at a venue, and events with their sessions: dates, rooms, spaces, guests, dietary needs and special requests.
service BookingService {
  option (google.api.default_host) = "aperio.shokki.engineering";
  option (mcp.v1.service) = {
    app: {
      display_name: "Bookings"
      version: "1.0.0"
      description: "Stays at a venue, and events with their sessions: dates, rooms, spaces, guests, dietary needs and special requests."
    }
  };

  // Retrieves one reservation.
  rpc GetReservation(GetReservationRequest) returns (Reservation) {
    option (google.api.http) = {get: "/v1/{name=venues/*/reservations/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists reservations.
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse) {
    option (google.api.http) = {get: "/v1/{parent=venues/*}/reservations"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a reservation.
  rpc CreateReservation(CreateReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{parent=venues/*}/reservations"
      body: "reservation"
    };
    option (google.api.method_signature) = "parent,reservation,reservation_id";
  }

  // Updates a reservation. Only the fields in update_mask are written.
  rpc UpdateReservation(UpdateReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      patch: "/v1/{reservation.name=venues/*/reservations/*}"
      body: "reservation"
    };
    option (google.api.method_signature) = "reservation,update_mask";
  }

  // Deletes a reservation.
  rpc DeleteReservation(DeleteReservationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=venues/*/reservations/*}"};
    option (google.api.method_signature) = "name";
  }

  // Confirms a pending reservation: its rooms stay taken.
  rpc ConfirmReservation(ConfirmReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{name=venues/*/reservations/*}:confirm"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Cancels a reservation and releases its rooms.
  rpc CancelReservation(CancelReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{name=venues/*/reservations/*}:cancel"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Records the guests' arrival at the venue.
  rpc ArriveReservation(ArriveReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{name=venues/*/reservations/*}:arrive"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Records the guests' departure.
  rpc DepartReservation(DepartReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{name=venues/*/reservations/*}:depart"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Retrieves one event.
  rpc GetEvent(GetEventRequest) returns (Event) {
    option (google.api.http) = {get: "/v1/{name=venues/*/events/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists events.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {get: "/v1/{parent=venues/*}/events"};
    option (google.api.method_signature) = "parent";
  }

  // Creates an event.
  rpc CreateEvent(CreateEventRequest) returns (Event) {
    option (google.api.http) = {
      post: "/v1/{parent=venues/*}/events"
      body: "event"
    };
    option (google.api.method_signature) = "parent,event,event_id";
  }

  // Updates an event. Only the fields in update_mask are written.
  rpc UpdateEvent(UpdateEventRequest) returns (Event) {
    option (google.api.http) = {
      patch: "/v1/{event.name=venues/*/events/*}"
      body: "event"
    };
    option (google.api.method_signature) = "event,update_mask";
  }

  // Deletes an event.
  rpc DeleteEvent(DeleteEventRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=venues/*/events/*}"};
    option (google.api.method_signature) = "name";
  }

  // Confirms a tentative event: its spaces stay taken.
  rpc ConfirmEvent(ConfirmEventRequest) returns (Event) {
    option (google.api.http) = {
      post: "/v1/{name=venues/*/events/*}:confirm"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Cancels an event and releases the spaces of its sessions.
  rpc CancelEvent(CancelEventRequest) returns (Event) {
    option (google.api.http) = {
      post: "/v1/{name=venues/*/events/*}:cancel"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Retrieves one session.
  rpc GetSession(GetSessionRequest) returns (Session) {
    option (google.api.http) = {get: "/v1/{name=venues/*/events/*/sessions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=venues/*/events/*}/sessions"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a session.
  rpc CreateSession(CreateSessionRequest) returns (Session) {
    option (google.api.http) = {
      post: "/v1/{parent=venues/*/events/*}/sessions"
      body: "session"
    };
    option (google.api.method_signature) = "parent,session,session_id";
  }

  // Updates a session. Only the fields in update_mask are written.
  rpc UpdateSession(UpdateSessionRequest) returns (Session) {
    option (google.api.http) = {
      patch: "/v1/{session.name=venues/*/events/*/sessions/*}"
      body: "session"
    };
    option (google.api.method_signature) = "session,update_mask";
  }

  // Deletes a session.
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=venues/*/events/*/sessions/*}"};
    option (google.api.method_signature) = "name";
  }
}
