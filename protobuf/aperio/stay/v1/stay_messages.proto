syntax = "proto3";

package aperio.stay.v1;

import "aperio/stay/v1/stay.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/stay/v1/staypbv1;staypbv1";
option java_multiple_files = true;
option java_outer_classname = "StayMessagesProto";
option java_package = "engineering.shokki.aperio.stay.v1";

// Request message for GetReservation.
message GetReservationRequest {
  // The name of the reservation to retrieve.
  // Format: venues/{venue}/reservations/{reservation}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.stay.v1/Reservation"
  ];
}

// Request message for ListReservations.
message ListReservationsRequest {
  // The parent whose reservations to list.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.stay.v1/Reservation"
  ];

  // The maximum number of reservations to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListReservations call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. arrival_date <= "2026-12-24" AND departure_date > "2026-12-24".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListReservations.
message ListReservationsResponse {
  // The reservations.
  repeated Reservation reservations = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateReservation.
message CreateReservationRequest {
  // The parent the reservation is created under.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.stay.v1/Reservation"
  ];

  // The reservation to create.
  Reservation reservation = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string reservation_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateReservation.
message UpdateReservationRequest {
  // The reservation to update, by its name.
  Reservation reservation = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for ConfirmReservation.
message ConfirmReservationRequest {
  // The name of the reservation to confirm.
  // Format: venues/{venue}/reservations/{reservation}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.stay.v1/Reservation"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for CancelReservation.
message CancelReservationRequest {
  // The name of the reservation to cancel.
  // Format: venues/{venue}/reservations/{reservation}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.stay.v1/Reservation"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Why, in the caller's words; kept on the reservation.
  string reason = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 2000
  ];
}

// Request message for ArriveReservation.
message ArriveReservationRequest {
  // The name of the reservation to arrive.
  // Format: venues/{venue}/reservations/{reservation}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.stay.v1/Reservation"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DepartReservation.
message DepartReservationRequest {
  // The name of the reservation to depart.
  // Format: venues/{venue}/reservations/{reservation}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.stay.v1/Reservation"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}
