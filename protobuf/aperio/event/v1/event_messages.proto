syntax = "proto3";

package aperio.event.v1;

import "aperio/event/v1/event.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/event/v1/eventpbv1;eventpbv1";
option java_multiple_files = true;
option java_outer_classname = "EventMessagesProto";
option java_package = "engineering.shokki.aperio.event.v1";

// Request message for GetEvent.
message GetEventRequest {
  // The name of the event to retrieve.
  // Format: venues/{venue}/events/{event}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.event.v1/Event"
  ];
}

// Request message for ListEvents.
message ListEventsRequest {
  // The parent whose events to list.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.event.v1/Event"
  ];

  // The maximum number of events to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListEvents call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. state = STATE_CONFIRMED.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListEvents.
message ListEventsResponse {
  // The events.
  repeated Event events = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateEvent.
message CreateEventRequest {
  // The parent the event is created under.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.event.v1/Event"
  ];

  // The event to create.
  Event event = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string event_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateEvent.
message UpdateEventRequest {
  // The event to update, by its name.
  Event event = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for ConfirmEvent.
message ConfirmEventRequest {
  // The name of the event to confirm.
  // Format: venues/{venue}/events/{event}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.event.v1/Event"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for CancelEvent.
message CancelEventRequest {
  // The name of the event to cancel.
  // Format: venues/{venue}/events/{event}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.event.v1/Event"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Why, in the caller's words; kept on the event.
  string reason = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 2000
  ];
}

// Request message for GetSession.
message GetSessionRequest {
  // The name of the session to retrieve.
  // Format: venues/{venue}/events/{event}/sessions/{session}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.event.v1/Session"
  ];
}

// Request message for ListSessions.
message ListSessionsRequest {
  // The parent whose sessions to list.
  // Format: venues/{venue}/events/{event}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.event.v1/Session"
  ];

  // The maximum number of sessions to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListSessions call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. start_time > "2026-12-24T00:00:00+05:30".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListSessions.
message ListSessionsResponse {
  // The sessions.
  repeated Session sessions = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateSession.
message CreateSessionRequest {
  // The parent the session is created under.
  // Format: venues/{venue}/events/{event}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.event.v1/Session"
  ];

  // The session to create.
  Session session = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string session_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateSession.
message UpdateSessionRequest {
  // The session to update, by its name.
  Session session = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DeleteSession.
message DeleteSessionRequest {
  // The name of the session to delete.
  // Format: venues/{venue}/events/{event}/sessions/{session}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.event.v1/Session"
  ];

  // The etag the caller last read; the delete fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without deleting anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for SummarizeSessions.
message SummarizeSessionsRequest {
  // The venue.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // The first day; today at the venue when unset.
  google.type.Date start_date = 2 [(google.api.field_behavior) = OPTIONAL];

  // How many days, from start_date; 1 when unset, at most 14.
  int32 days = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 14
    }
  ];
}

// Response message for SummarizeSessions. Sessions of cancelled events are
// left out.
message SummarizeSessionsResponse {
  // The days, in order; a day with no sessions is still listed.
  repeated SessionDay days = 1;
}

// One day's sessions at a venue.
message SessionDay {
  // The day, at the venue.
  google.type.Date date = 1;

  // The guests expected across the day's sessions.
  int32 covers = 2;

  // The day's plates by diet, most first.
  repeated DietCount diets = 3;

  // The day's sessions, by start time.
  repeated SessionBrief sessions = 4;
}

// A session as the kitchen and the banquet team read it.
message SessionBrief {
  // The session.
  // Format: venues/{venue}/events/{event}/sessions/{session}
  string session = 1 [(google.api.resource_reference).type = "aperio.event.v1/Session"];

  // The event's title: "Doe wedding".
  string event = 2;

  // The session's title: "Sangeet".
  string title = 3;

  // The host's name.
  string host = 4;

  // Where it is held: "Grand Ballroom".
  string space = 5;

  // When guests arrive.
  google.protobuf.Timestamp start_time = 6;

  // When it ends.
  google.protobuf.Timestamp end_time = 7;

  // The guests expected.
  int32 guests = 8;

  // The count the host guarantees to pay for.
  int32 guaranteed_guests = 9;

  // The menu served: "Silver Vegetarian".
  string menu = 10;

  // The plates by diet: vegetarian, Jain, allergic to peanut.
  repeated DietCount diets = 11;

  // What the host asked for at this session.
  repeated string requests = 12;

  // Where the event is in its life.
  Event.State state = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// How many plates of one kind.
message DietCount {
  // The kind, as said: "vegetarian", "jain", "allergic to peanut".
  string diet = 1;

  // The plates of it.
  int32 guests = 2;
}
