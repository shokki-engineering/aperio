syntax = "proto3";

package aperio.sales.v1;

import "aperio/sales/v1/enums.proto";
import "aperio/sales/v1/sales.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/money.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/sales/v1/salespbv1;salespbv1";
option java_multiple_files = true;
option java_outer_classname = "SalesMessagesProto";
option java_package = "engineering.shokki.aperio.sales.v1";

// Request message for GetLead.
message GetLeadRequest {
  // The name of the lead to retrieve.
  // Format: leads/{lead}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.sales.v1/Lead"
  ];
}

// Request message for ListLeads.
message ListLeadsRequest {
  // The maximum number of leads to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListLeads call.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. stage = STAGE_PROPOSAL.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListLeads.
message ListLeadsResponse {
  // The leads.
  repeated Lead leads = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateLead.
message CreateLeadRequest {
  // The lead to create.
  Lead lead = 1 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string lead_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateLead.
message UpdateLeadRequest {
  // The lead to update, by its name.
  Lead lead = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for GetActivity.
message GetActivityRequest {
  // The name of the activity to retrieve.
  // Format: leads/{lead}/activities/{activity}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.sales.v1/Activity"
  ];
}

// Request message for ListActivities.
message ListActivitiesRequest {
  // The parent whose activities to list.
  // Format: leads/{lead}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.sales.v1/Activity"
  ];

  // The maximum number of activities to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListActivities call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. kind = ACTIVITY_KIND_SITE_VISIT.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListActivities.
message ListActivitiesResponse {
  // The activities.
  repeated Activity activities = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateActivity.
message CreateActivityRequest {
  // The parent the activity is created under.
  // Format: leads/{lead}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.sales.v1/Activity"
  ];

  // The activity to create.
  Activity activity = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string activity_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for GetQuote.
message GetQuoteRequest {
  // The name of the quote to retrieve.
  // Format: venues/{venue}/quotes/{quote}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.sales.v1/Quote"
  ];
}

// Request message for ListQuotes.
message ListQuotesRequest {
  // The parent whose quotes to list.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.sales.v1/Quote"
  ];

  // The maximum number of quotes to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListQuotes call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. state = STATE_SENT.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListQuotes.
message ListQuotesResponse {
  // The quotes.
  repeated Quote quotes = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateQuote.
message CreateQuoteRequest {
  // The parent the quote is created under.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.sales.v1/Quote"
  ];

  // The quote to create.
  Quote quote = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string quote_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateQuote.
message UpdateQuoteRequest {
  // The quote to update, by its name.
  Quote quote = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for SendQuote.
message SendQuoteRequest {
  // The name of the quote to send.
  // Format: venues/{venue}/quotes/{quote}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.sales.v1/Quote"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // How long the offer stands once sent: its expire_time is the send time
  // plus this; 14 days when unset.
  google.protobuf.Duration ttl = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).duration = {
      gte: {seconds: 3600}
      lte: {seconds: 31536000}
    }
  ];
}

// Request message for AcceptQuote.
message AcceptQuoteRequest {
  // The name of the quote to accept.
  // Format: venues/{venue}/quotes/{quote}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.sales.v1/Quote"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DeclineQuote.
message DeclineQuoteRequest {
  // The name of the quote to decline.
  // Format: venues/{venue}/quotes/{quote}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.sales.v1/Quote"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Why, in the caller's words; kept on the quote.
  string reason = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 2000
  ];
}

// Request message for ReviseQuote.
message ReviseQuoteRequest {
  // The name of the quote to revise.
  // Format: venues/{venue}/quotes/{quote}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.sales.v1/Quote"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for SummarizePipeline.
message SummarizePipelineRequest {
  // The venue.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // How many days ahead a follow-up or a quote's expiry counts as due, and
  // back a win or a loss counts as lately; 7 when unset.
  int32 days = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 90
    }
  ];
}

// Response message for SummarizePipeline.
message SummarizePipelineResponse {
  // The open leads by stage, in the pipeline's order.
  repeated StageCount stages = 1;

  // The leads won in the last days.
  int32 won = 2;

  // The leads lost in the last days.
  int32 lost = 3;

  // Open leads whose follow-up is overdue or due within days, soonest first.
  repeated LeadBrief follow_ups = 4;

  // Leads still NEW: nobody has contacted them, oldest first.
  repeated LeadBrief uncontacted = 5;

  // Sent quotes expiring within days, soonest first.
  repeated QuoteBrief expiring = 6;
}

// How many open leads are at one stage.
message StageCount {
  // The stage.
  Stage stage = 1;

  // The leads at it.
  int32 leads = 2;
}

// A lead as the sales team reads it.
message LeadBrief {
  // The lead.
  // Format: leads/{lead}
  string lead = 1 [(google.api.resource_reference).type = "aperio.sales.v1/Lead"];

  // Its title: "Doe wedding, Dec 2026".
  string title = 2;

  // Who is asking.
  string contact = 3;

  // Their phone, E.164.
  string phone = 4;

  // Where it is.
  Stage stage = 5;

  // When it is next to be followed up.
  google.protobuf.Timestamp next_follow_up_time = 6;

  // When it came in.
  google.protobuf.Timestamp create_time = 7;
}

// A quote as the sales team reads it.
message QuoteBrief {
  // The quote.
  // Format: venues/{venue}/quotes/{quote}
  string quote = 1 [(google.api.resource_reference).type = "aperio.sales.v1/Quote"];

  // Its title.
  string title = 2;

  // Who it is for.
  string contact = 3;

  // What it comes to, with taxes.
  google.type.Money total = 4;

  // When it expires.
  google.protobuf.Timestamp expire_time = 5;
}
