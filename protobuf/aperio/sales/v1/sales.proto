syntax = "proto3";

package aperio.sales.v1;

import "aperio/sales/v1/enums.proto";
import "aperio/type/v1/enums.proto";
import "aperio/type/v1/types.proto";
import "buf/validate/validate.proto";
import "entity/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/money.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/sales/v1/salespbv1;salespbv1";
option java_multiple_files = true;
option java_outer_classname = "SalesProto";
option java_package = "engineering.shokki.aperio.sales.v1";

// A Lead is an enquiry that may become a booking: a couple asking about a
// December wedding, a company asking for an offsite with forty rooms, a
// family asking about a week at the resort. It covers both venues and every
// kind of booking -- a stay, an event, or both, as a wedding with rooms for
// its guests is.
//
// A lead moves through a sales pipeline, from NEW to WON or LOST, owned by
// one salesperson with a follow-up date. While it is negotiated its dates
// can be held in freebusy (`hold`), so they are not sold under it; winning it
// turns the accepted quote into the booking.
message Lead {
  // The pipeline is read by stage and owner, and worked by follow-up date.
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    indexes: [
      {
        columns: [
          "stage",
          "next_follow_up_time"
        ]
      },
      {
        columns: [
          "owner",
          "stage"
        ]
      },
      {
        columns: ["update_time"]
      }
    ]
  };

  option (google.api.resource) = {
    type: "aperio.sales.v1/Lead"
    pattern: "leads/{lead}"
    singular: "lead"
    plural: "leads"
  };

  // The lead name.
  // Format: leads/{lead}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^leads/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // A short title for the pipeline, e.g. "Doe–Roe wedding, Dec 2026".
  string display_name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (store.v1.query) = {search: true}
  ];

  // Who is asking.
  // Format: contacts/{contact}
  string contact = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.guest.v1/Contact",
    (buf.validate.field).string.pattern = "^contacts/[^/]+$"
  ];

  // The venue asked about; empty while the guest is still choosing.
  // Format: venues/{venue}
  string venue = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue",
    (buf.validate.field).string.pattern = "^venues/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // What the guest wants to book.
  LeadKind kind = 5 [(google.api.field_behavior) = REQUIRED];

  // The occasion, for an event.
  aperio.type.v1.EventType event_type = 6 [(google.api.field_behavior) = OPTIONAL];

  // Where the lead came from.
  aperio.type.v1.Channel source = 7 [(google.api.field_behavior) = OPTIONAL];

  // More on the source: the campaign, the referrer, the agent.
  string source_detail = 8 [(google.api.field_behavior) = OPTIONAL];

  // Where the lead is in the pipeline.
  Stage stage = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.column) = {default_value: "NEW"}
  ];

  // The dates asked for, in order of preference.
  repeated aperio.type.v1.DateRange dates = 10 [(google.api.field_behavior) = OPTIONAL];

  // Whether the guest would take other dates.
  bool dates_flexible = 11 [(google.api.field_behavior) = OPTIONAL];

  // How many guests are expected.
  int32 guests = 12 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // How many rooms are wanted, for a stay or an event's guests.
  int32 rooms = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // What the guest means to spend, in all.
  google.type.Money budget = 14 [(google.api.field_behavior) = OPTIONAL];

  // What the guest needs that the rest does not say: decor, a mandap, a band,
  // a vegetarian-only kitchen.
  string requirements = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 10000
  ];

  // The salesperson who owns the lead.
  // Format: users/{user}
  string owner = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "users.shokki.engineering/User",
    (store.v1.reference) = {on_delete: ON_DELETE_ALLOW},
    (buf.validate.field).string.pattern = "^users/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // When the owner is next to get in touch.
  google.protobuf.Timestamp next_follow_up_time = 17 [(google.api.field_behavior) = OPTIONAL];

  // Why the lead was lost, once it is.
  LostReason lost_reason = 18 [(google.api.field_behavior) = OPTIONAL];

  // More on why it was lost: the competitor, the price asked for.
  string lost_detail = 19 [(google.api.field_behavior) = OPTIONAL];

  // The freebusy hold keeping the lead's first dates while it is negotiated.
  // Format: holds/{hold}
  string hold = 20 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "freebusy.allocation.v1/Hold"
  ];

  // The bookings the lead became, once won.
  repeated string bookings = 21 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the lead was won or lost.
  google.protobuf.Timestamp close_time = 22 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 23 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 24 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 25 [(google.api.field_behavior) = OPTIONAL];
}

// An Activity is one touch on a lead: a call, a WhatsApp, a site visit, a
// quote sent. The activities of a lead are its history, newest first.
message Activity {
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  option (google.api.resource) = {
    type: "aperio.sales.v1/Activity"
    pattern: "leads/{lead}/activities/{activity}"
    singular: "activity"
    plural: "activities"
  };

  // The activity name.
  // Format: leads/{lead}/activities/{activity}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^leads/[^/]+/activities/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // What happened.
  ActivityKind kind = 2 [(google.api.field_behavior) = REQUIRED];

  // When it happened.
  google.protobuf.Timestamp occur_time = 3 [(google.api.field_behavior) = REQUIRED];

  // What was said or done, in a line.
  string summary = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ];

  // The rest of it.
  string details = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 10000
  ];

  // Who did it.
  // Format: users/{user}
  string author = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "users.shokki.engineering/User",
    (store.v1.reference) = {on_delete: ON_DELETE_ALLOW},
    (buf.validate.field).string.pattern = "^users/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 9 [(google.api.field_behavior) = OPTIONAL];
}

// A Quote is a priced proposal to a guest: the spaces, rooms, menus and
// packages they asked for, at the prices of their dates, with GST. A lead
// usually has several, one superseding the next as the negotiation goes;
// accepting one makes the booking.
//
// A draft's line prices follow the price rules as they change. Sending the
// quote fixes them, so the guest is held to what they were offered and no
// rule changed after can change it.
message Quote {
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    indexes: [
      {
        columns: [
          "lead",
          "create_time"
        ]
      },
      {
        columns: [
          "state",
          "expire_time"
        ]
      }
    ]
  };

  option (google.api.resource) = {
    type: "aperio.sales.v1/Quote"
    pattern: "venues/{venue}/quotes/{quote}"
    singular: "quote"
    plural: "quotes"
  };

  // The quote name.
  // Format: venues/{venue}/quotes/{quote}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^venues/[^/]+/quotes/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The quote's title, e.g. "Doe–Roe wedding -- option B".
  string display_name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    }
  ];

  // The guest it is for, who is billed.
  // Format: contacts/{contact}
  string contact = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.guest.v1/Contact",
    (buf.validate.field).string.pattern = "^contacts/[^/]+$"
  ];

  // The lead it answers.
  // Format: leads/{lead}
  string lead = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "aperio.sales.v1/Lead",
    (buf.validate.field).string.pattern = "^leads/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The quote this one revises. Set by ReviseQuote, which makes the
  // revision.
  // Format: venues/{venue}/quotes/{quote}
  string supersedes = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Lifecycle state, moved by the custom methods.
  State state = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.column) = {default_value: "DRAFT"}
  ];

  // The occasion, for an event quote.
  aperio.type.v1.EventType event_type = 7 [(google.api.field_behavior) = OPTIONAL];

  // The dates quoted for.
  aperio.type.v1.DateRange dates = 8 [(google.api.field_behavior) = REQUIRED];

  // The guests quoted for.
  int32 guests = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // The lines, in the order the proposal shows them.
  repeated QuoteLine lines = 10 [(google.api.field_behavior) = REQUIRED];

  // The GST state code of the place of supply: the venue's, for services at
  // the venue. With the venue's registration it decides CGST and SGST or
  // IGST.
  string supply_state_code = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[0-9]{2}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The total of the lines before tax.
  google.type.Money subtotal = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The GST on the lines.
  google.type.Money tax_total = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the guest pays: subtotal and tax.
  google.type.Money total = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The advance asked for to confirm, e.g. 25% of the total.
  google.type.Money advance = 15 [(google.api.field_behavior) = OPTIONAL];

  // The terms: cancellation, payment schedule, what the venue does not allow.
  string terms = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 20000
  ];

  // When the offer lapses: ttl after it is sent.
  google.protobuf.Timestamp expire_time = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was sent and its prices fixed. Set by SendQuote.
  google.protobuf.Timestamp send_time = 18 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the guest accepted it. Set by AcceptQuote.
  google.protobuf.Timestamp accept_time = 19 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The booking accepting it made: a reservation or an event.
  string booking = 20 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "*"
  ];

  // Why the guest declined it. Set by DeclineQuote.
  string decline_reason = 21 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 22 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 23 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 24 [(google.api.field_behavior) = OPTIONAL];

  // How long the offer stands once it is sent, e.g. 14 days.
  google.protobuf.Duration ttl = 25 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = OPTIONAL
  ];

  // Where a quote is in its life.
  enum State {
    // Default; never persisted.
    STATE_UNSPECIFIED = 0;

    // Being prepared; its prices follow the price rules.
    STATE_DRAFT = 1;

    // Sent to the guest; its prices fixed.
    STATE_SENT = 2;

    // Accepted; the booking made.
    STATE_ACCEPTED = 3;

    // Declined by the guest.
    STATE_DECLINED = 4;

    // Lapsed unanswered.
    STATE_EXPIRED = 5;

    // Replaced by a revision made by ReviseQuote.
    STATE_SUPERSEDED = 6;
  }
}

// QuoteLine is one priced line of a quote: 300 plates of Silver Vegetarian
// on 12 December, the ballroom for the evening, 20 Deluxe rooms for two
// nights, a 5% discount.
message QuoteLine {
  // What the line sells.
  LineKind kind = 1 [(google.api.field_behavior) = REQUIRED];

  // The menu, fixed package, space or dish it sells; empty for a service or
  // a discount described in full.
  string item = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "*"
  ];

  // The line as the proposal shows it; the item's name when empty.
  string description = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 2000
  ];

  // The date the line is priced for: the event day, the first night.
  google.type.Date service_date = 4 [(google.api.field_behavior) = OPTIONAL];

  // How many: plates, nights of a room, hours, units.
  int32 quantity = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32.gt = 0
  ];

  // The price of one, from CalculatePrice for the service date unless the
  // line sets it by hand.
  google.type.Money unit_price = 6 [(google.api.field_behavior) = OPTIONAL];

  // Whether unit_price was set by hand: a negotiated price no rule changes.
  bool price_override = 7 [(google.api.field_behavior) = OPTIONAL];

  // The price rule that set unit_price, when one did.
  // Format: venues/{venue}/priceRules/{price_rule}
  string price_rule = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "aperio.pricing.v1/PriceRule"
  ];

  // How GST applies to the line; the item's when empty.
  aperio.type.v1.Tax tax = 9 [(google.api.field_behavior) = OPTIONAL];

  // quantity × unit_price, before tax.
  google.type.Money amount = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The GST on amount.
  google.type.Money tax_amount = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}
