syntax = "proto3";

package aperio.concierge.v1;

import "aperio/concierge/v1/enums.proto";
import "aperio/type/v1/enums.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/money.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/concierge/v1/conciergepbv1;conciergepbv1";
option java_multiple_files = true;
option java_outer_classname = "ConciergeMessagesProto";
option java_package = "engineering.shokki.aperio.concierge.v1";

// Request message for FindStay.
message FindStayRequest {
  // The venue to stay at.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // The day of arrival.
  google.type.Date arrival_date = 2 [(google.api.field_behavior) = REQUIRED];

  // How many nights.
  int32 nights = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 30
    }
  ];

  // How many rooms; one when empty.
  int32 rooms = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 20
    }
  ];

  // How many adults.
  int32 adults = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 60
    }
  ];

  // How many children.
  int32 children = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 60
    }
  ];
}

// Response message for FindStay.
message FindStayResponse {
  // The room types free for the stay, cheapest first; at most three, as many
  // as a guest weighs at once.
  repeated StayOption options = 1;

  // The options as a sentence to say.
  string spoken = 2;
}

// StayOption is a room type with the rooms asked for free for every night of
// a stay, and what the stay costs in it.
message StayOption {
  // The room type: a space of the venue.
  // Format: venues/{venue}/spaces/{space}
  string space = 1 [(google.api.resource_reference).type = "aperio.venue.v1/Space"];

  // The room type as a guest knows it, e.g. "Sea View Deluxe".
  string display_name = 2;

  reserved 3;
  reserved "rooms_free";

  // The stay in it -- every room, every night -- before tax.
  google.type.Money total = 4;

  // The option as a sentence to say.
  string spoken = 5;
}

// Request message for HoldStay.
message HoldStayRequest {
  // The venue to stay at.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // The room type, from FindStay.
  // Format: venues/{venue}/spaces/{space}
  string space = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Space"
  ];

  // The day of arrival.
  google.type.Date arrival_date = 3 [(google.api.field_behavior) = REQUIRED];

  // How many nights.
  int32 nights = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 30
    }
  ];

  // How many rooms; one when empty.
  int32 rooms = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 20
    }
  ];

  // How many adults.
  int32 adults = 6 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 60
    }
  ];

  // How many children.
  int32 children = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 60
    }
  ];

  // The guest's name, as the booking is to be under. Asked for when empty.
  string guest_display_name = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 200
  ];

  // The guest's phone, which finds a returning guest. Asked for when empty;
  // on a call, the number calling.
  string phone = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 32
  ];

  // The guest's email, for the confirmation; optional.
  string email = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.email = true
  ];

  // Anything the guest asks for: an early check-in, a cot.
  string special_requests = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 1000
  ];

  // Where the guest is asking from: WEBSITE, PHONE, WHATSAPP.
  aperio.type.v1.Channel channel = 12 [(google.api.field_behavior) = OPTIONAL];

  // A UUID for this attempt: the same one holds the same rooms again rather
  // than more of them, so a retried request is safe (AIP-155).
  string request_id = 13 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true
  ];
}

// Response message for HoldStay.
message HoldStayResponse {
  // What ConfirmStay books with: the hold, the guest and the price, sealed so
  // none of them changes on the way.
  string hold_token = 1;

  // When the hold lapses, freeing the rooms, unless the stay is confirmed.
  google.protobuf.Timestamp expire_time = 2;

  // The stay before tax: every room, every night.
  google.type.Money total = 3;

  // The hold as a sentence to say, asking the guest to agree.
  string spoken = 4;
}

// Request message for ConfirmStay.
message ConfirmStayRequest {
  // The venue the hold is at.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // The token HoldStay returned.
  string hold_token = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// Response message for ConfirmStay.
message ConfirmStayResponse {
  // The booking made: PENDING until its advance is paid.
  // Format: venues/{venue}/reservations/{reservation}
  string reservation = 1 [(google.api.resource_reference).type = "aperio.stay.v1/Reservation"];

  // The stay before tax.
  google.type.Money total = 2;

  // The booking as a sentence to say.
  string spoken = 3;

  // The booking's short reference, e.g. "7F3A9C": what the guest quotes to
  // find or cancel it with FindBooking and CancelBooking.
  string reference = 4;
}

// Request message for FindBooking.
message FindBookingRequest {
  // The venue booked at.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // The guest's phone, as the booking was made with.
  string phone = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 6
      max_len: 32
    }
  ];

  // The booking's reference, from ConfirmStay. This or arrival_date is
  // needed: a phone number alone shows nothing, as anyone can say one.
  string reference = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 16
  ];

  // The day of arrival, when the guest does not have the reference.
  google.type.Date arrival_date = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for FindBooking.
message FindBookingResponse {
  // The guest's bookings that match.
  repeated BookingSummary bookings = 1;

  // The bookings as a sentence to say.
  string spoken = 2;
}

// BookingSummary is a guest's stay, as the guest is told it.
message BookingSummary {
  // The stay.
  // Format: venues/{venue}/reservations/{reservation}
  string reservation = 1 [(google.api.resource_reference).type = "aperio.stay.v1/Reservation"];

  // Its short reference.
  string reference = 2;

  // The day of arrival.
  google.type.Date arrival_date = 3;

  // The day of departure.
  google.type.Date departure_date = 4;

  // Where it is in its life, as the stay service names it: "PENDING",
  // "CONFIRMED", "CHECKED_IN", "CHECKED_OUT", "CANCELLED".
  string state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The stay as a sentence to say.
  string spoken = 6;
}

// Request message for CancelBooking.
message CancelBookingRequest {
  // The venue booked at.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // The guest's phone, as the booking was made with.
  string phone = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 6
      max_len: 32
    }
  ];

  // The booking's reference.
  string reference = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 4
      max_len: 16
    }
  ];

  // Why, in the guest's words; kept on the booking.
  string reason = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 500
  ];
}

// Response message for CancelBooking.
message CancelBookingResponse {
  // The stay cancelled.
  // Format: venues/{venue}/reservations/{reservation}
  string reservation = 1 [(google.api.resource_reference).type = "aperio.stay.v1/Reservation"];

  // The cancellation as a sentence to say.
  string spoken = 2;
}

// Request message for EnquireEvent.
message EnquireEventRequest {
  // The venue to hold the event at.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // The occasion: a wedding, a conference, a birthday.
  aperio.type.v1.EventType event_type = 2 [(google.api.field_behavior) = REQUIRED];

  // The day of the event.
  google.type.Date event_date = 3 [(google.api.field_behavior) = REQUIRED];

  // How many guests.
  int32 guests = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 5000
    }
  ];

  // The diet the menus must suit, if one: vegetarian, Jain.
  aperio.type.v1.Diet diet = 5 [(google.api.field_behavior) = OPTIONAL];

  // The guest's name. Asked for when empty.
  string guest_display_name = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 200
  ];

  // The guest's phone. Asked for when empty; on a call, the number calling.
  string phone = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 32
  ];

  // The guest's email, for the quote; optional.
  string email = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.email = true
  ];

  // Anything else the guest wants: a theme, a stage, rooms for family.
  string notes = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 2000
  ];

  // Where the guest is asking from: WEBSITE, PHONE, WHATSAPP.
  aperio.type.v1.Channel channel = 10 [(google.api.field_behavior) = OPTIONAL];

  // A UUID for this enquiry: a retry with the same one finds the enquiry the
  // first made rather than making another (AIP-155).
  string request_id = 11 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true
  ];
}

// Response message for EnquireEvent.
message EnquireEventResponse {
  // The lead the enquiry made, which the venue's sales team follows up.
  // Format: leads/{lead}
  string lead = 1 [(google.api.resource_reference).type = "aperio.sales.v1/Lead"];

  // A draft quote with the cheapest menu that fits, for the team to send;
  // empty when no menu fits.
  // Format: venues/{venue}/quotes/{quote}
  string quote = 2 [(google.api.resource_reference).type = "aperio.sales.v1/Quote"];

  // The menus that suit the guests and their diet, cheapest first; at most
  // three.
  repeated MenuOption menus = 3;

  // The halls that seat the guests and are free that day.
  repeated string halls = 4;

  // The enquiry as a sentence to say.
  string spoken = 5;
}

// MenuOption is a plate menu that suits an enquiry, priced for its day.
message MenuOption {
  // The menu.
  // Format: venues/{venue}/menus/{menu}
  string menu = 1 [(google.api.resource_reference).type = "aperio.catalog.v1/Menu"];

  // The menu as it is sold, e.g. "Silver Vegetarian".
  string display_name = 2;

  // A plate, on the day, before tax.
  google.type.Money plate_price = 3;

  // Every guest's plate, before tax.
  google.type.Money total = 4;

  // The option as a sentence to say.
  string spoken = 5;
}

// Request message for RequestService.
message RequestServiceRequest {
  // The venue the guest is at.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // What kind of thing the guest wants.
  ServiceKind kind = 2 [(google.api.field_behavior) = REQUIRED];

  // What, in the guest's words: "black coffee", "two towels", "the AC".
  string what = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    }
  ];

  // How many; one when empty.
  int32 quantity = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // Where to: "Room 204", "the ballroom", "the pool deck".
  string location = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }
  ];

  // Anything else: "no sugar", "after 4 pm".
  string notes = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 1000
  ];

  // Whether it is wanted now rather than in the usual time.
  bool urgent = 7 [(google.api.field_behavior) = OPTIONAL];

  // A UUID for this request: a retry with the same one finds the request
  // the first made (AIP-155).
  string request_id = 8 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true
  ];
}

// Response message for RequestService.
message RequestServiceResponse {
  // The service request the department works.
  // Format: venues/{venue}/serviceRequests/{service_request}
  string service_request = 1 [(google.api.resource_reference).type = "aperio.operations.v1/ServiceRequest"];

  // The request as a sentence to say.
  string spoken = 2;
}
