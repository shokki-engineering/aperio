syntax = "proto3";

package aperio.venue.v1;

import "aperio/type/v1/types.proto";
import "aperio/venue/v1/enums.proto";
import "buf/validate/validate.proto";
import "cache/v1/annotations.proto";
import "entity/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/postal_address.proto";
import "protobuf/opentravel/hotel/hotel/v1/types/hotel_info.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/venue/v1/venuepbv1;venuepbv1";
option java_multiple_files = true;
option java_outer_classname = "VenueProto";
option java_package = "engineering.shokki.aperio.venue.v1";

// A Venue is one property aperio sells: a resort whose rooms are booked by the
// night, or a hall whose spaces are booked for events. Everything else hangs
// off a venue -- its spaces, reservations, events, menus, packages, quotes,
// invoices, payments and documents -- because each venue is its own place of
// business: its own GSTIN and its own invoice series.
//
// The venue is aperio's record; its availability is freebusy's. The venue's
// rooms and halls are freebusy resources, named by its spaces
// (Space.resources), and every booking aperio takes is a freebusy hold and
// reservation on them first.
message Venue {
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  // Venues are read on nearly every call and change by hand.
  option (cache.v1.cache) = {
    enabled: true
    ttl: {seconds: 600}
    list: {
      enabled: true
      ttl: {seconds: 60}
    }
  };

  option (google.api.resource) = {
    type: "aperio.venue.v1/Venue"
    pattern: "venues/{venue}"
    singular: "venue"
    plural: "venues"
  };

  // The venue name.
  // Format: venues/{venue}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^venues/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The venue as its guests know it, e.g. "Sea Breeze Resort".
  string display_name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (store.v1.query) = {search: true}
  ];

  // What the venue sells: stays, events, or both.
  VenueKind kind = 3 [(google.api.field_behavior) = REQUIRED];

  // A freebusy site (organizational unit) once grouped a venue's resources;
  // freebusy has no sites now, and a venue's resources are its spaces'.
  reserved 4;
  reserved "site";

  // The venue's street address, printed on its invoices.
  google.type.PostalAddress address = 5 [(google.api.field_behavior) = REQUIRED];

  // The venue's IANA time zone, e.g. "Asia/Kolkata". Stays and events are
  // read and shown in it.
  string time_zone = 6 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // The ISO 4217 currency the venue keeps its books in, e.g. "INR". Prices,
  // invoices and the base amount of every payment are in it.
  string currency_code = 7 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[A-Z]{3}$"
  ];

  // The venue's GST registration, printed on its tax invoices as the
  // supplier's GSTIN.
  aperio.type.v1.Gst gst = 8 [(google.api.field_behavior) = REQUIRED];

  // The venue's descriptive content in the OpenTravel vocabulary -- its
  // services and amenities, policies, position, languages -- as channels
  // receive it in OTA_HotelDescriptiveContentNotif. Kept whole as a document.
  protobuf.opentravel.hotel.hotel.v1.types.HotelInfo hotel_info = 9 [(google.api.field_behavior) = OPTIONAL];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 12 [(google.api.field_behavior) = OPTIONAL];
}

// A Space is what a venue sells a booking of: a room type at the resort, a
// hall, a lawn, a conference room. A room type stands for many rooms, each a
// freebusy resource; a hall is usually one.
message Space {
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  // Spaces are read with every quote, booking and availability check.
  option (cache.v1.cache) = {
    enabled: true
    ttl: {seconds: 600}
    list: {
      enabled: true
      ttl: {seconds: 60}
    }
  };

  option (google.api.resource) = {
    type: "aperio.venue.v1/Space"
    pattern: "venues/{venue}/spaces/{space}"
    singular: "space"
    plural: "spaces"
  };

  // The space name.
  // Format: venues/{venue}/spaces/{space}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^venues/[^/]+/spaces/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The space as guests know it, e.g. "Deluxe Sea View" or "Grand Ballroom".
  string display_name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (store.v1.query) = {search: true}
  ];

  // What kind of space it is.
  SpaceKind kind = 3 [(google.api.field_behavior) = REQUIRED];

  // The freebusy resources booking this space takes from: the rooms of a room
  // type, or the one resource of a hall.
  // Format: resources/{resource}
  repeated string resources = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "the-protobuf-project.org/Resource"
  ];

  // How many guests the space takes, by layout.
  Capacity capacity = 5 [(google.api.field_behavior) = OPTIONAL];

  // The room type's code on the channels (OTA InvTypeCode), when it is sold
  // there; rates, inventory and reservations from channels name it.
  string inventory_code = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.query) = {search: true}
  ];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Capacity is how many guests a space takes. A room uses occupancy; a hall
// uses the layouts it can be set in.
message Capacity {
  // The most adults a room sleeps.
  int32 max_adults = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // The most children a room sleeps besides the adults.
  int32 max_children = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // The guests a hall seats, by layout.
  repeated LayoutCapacity layouts = 3 [(google.api.field_behavior) = OPTIONAL];
}

// LayoutCapacity is how many guests a space seats in one layout.
message LayoutCapacity {
  // The layout.
  Layout layout = 1 [(google.api.field_behavior) = REQUIRED];

  // How many guests it seats in that layout.
  int32 guests = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32.gt = 0
  ];
}
