syntax = "proto3";

package aperio.venue.v1;

import "aperio/venue/v1/venue.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/venue/v1/venuepbv1;venuepbv1";
option java_multiple_files = true;
option java_outer_classname = "VenueMessagesProto";
option java_package = "engineering.shokki.aperio.venue.v1";

// Request message for GetVenue.
message GetVenueRequest {
  // The name of the venue to retrieve.
  // Format: venues/{venue}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];
}

// Request message for ListVenues.
message ListVenuesRequest {
  // The maximum number of venues to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListVenues call.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. kind = VENUE_KIND_EVENTS.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListVenues.
message ListVenuesResponse {
  // The venues.
  repeated Venue venues = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateVenue.
message CreateVenueRequest {
  // The venue to create.
  Venue venue = 1 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string venue_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateVenue.
message UpdateVenueRequest {
  // The venue to update, by its name.
  Venue venue = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DeleteVenue.
message DeleteVenueRequest {
  // The name of the venue to delete.
  // Format: venues/{venue}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // The etag the caller last read; the delete fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without deleting anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];

  // Delete its spaces, bookings and records too; without it, a
  // venue that has any fails with FAILED_PRECONDITION.
  bool force = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for GetSpace.
message GetSpaceRequest {
  // The name of the space to retrieve.
  // Format: venues/{venue}/spaces/{space}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Space"
  ];
}

// Request message for ListSpaces.
message ListSpacesRequest {
  // The parent whose spaces to list.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.venue.v1/Space"
  ];

  // The maximum number of spaces to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListSpaces call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. kind = SPACE_KIND_HALL.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListSpaces.
message ListSpacesResponse {
  // The spaces.
  repeated Space spaces = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateSpace.
message CreateSpaceRequest {
  // The parent the space is created under.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.venue.v1/Space"
  ];

  // The space to create.
  Space space = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string space_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateSpace.
message UpdateSpaceRequest {
  // The space to update, by its name.
  Space space = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DeleteSpace.
message DeleteSpaceRequest {
  // The name of the space to delete.
  // Format: venues/{venue}/spaces/{space}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Space"
  ];

  // The etag the caller last read; the delete fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without deleting anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}
