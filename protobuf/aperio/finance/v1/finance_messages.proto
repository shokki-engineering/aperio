// Request message for SummarizeReceivables.
message SummarizeReceivablesRequest {
  // The venue.
  // Format: venues/{venue}
  string venue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue"
  ];

  // How many debtors to list, most owed first; 10 when unset.
  int32 debtors = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];
}

// Response message for SummarizeReceivables, in the venue's currency. Only
// issued invoices are owed: drafts, paid and cancelled ones are not.
message SummarizeReceivablesResponse {
  // The day it is counted on, at the venue.
  google.type.Date date = 1;

  // What issued invoices still ask for.
  google.type.Money outstanding = 2;

  // The part of it past its due date.
  google.type.Money overdue = 3;

  // The outstanding by how long past due: "current", "1-30", "31-60",
  // "61-90", "90+" days.
  repeated AgeBucket aging = 4;

  // Who owes the most, most first.
  repeated Debtor debtors = 5;

  // What came in this month, less refunds.
  google.type.Money collected = 6;
}

// The outstanding of one age.
message AgeBucket {
  // How long past due: "current", "1-30", "31-60", "61-90", "90+".
  string age = 1;

  // What is owed at that age.
  google.type.Money amount = 2;

  // The invoices owing it.
  int32 invoices = 3;
}

// A guest who owes the venue.
message Debtor {
  // The guest.
  // Format: contacts/{contact}
  string contact = 1 [(google.api.resource_reference).type = "aperio.guest.v1/Contact"];

  // Their name.
  string display_name = 2;

  // Their phone, E.164.
  string phone = 3;

  // What they owe.
  google.type.Money due = 4;

  // The invoices owing it.
  int32 invoices = 5;

  // The earliest due date among them.
  google.type.Date oldest_due_date = 6;
}

// Request message for ClearPayment.
message ClearPaymentRequest {
  // The name of the payment to clear.
  // Format: venues/{venue}/payments/{payment}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.finance.v1/Payment"
  ];

  // The etag the caller last read; the call fails when it has changed.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for RequestPayment.
message RequestPaymentRequest {
  // The name of the issued invoice to be paid.
  // Format: venues/{venue}/invoices/{invoice}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.finance.v1/Invoice"
  ];

  // What to ask for; the invoice's due amount when unset. Never more.
  google.type.Money amount = 2 [(google.api.field_behavior) = OPTIONAL];

  // How long the link stands; 7 days when unset.
  google.protobuf.Duration ttl = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).duration = {
      gte: {seconds: 900}
      lte: {seconds: 2592000}
    }
  ];

  // A UUID for this request: a retry with the same one returns the same link
  // rather than another (AIP-155).
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true
  ];
}

// Response message for RequestPayment.
message RequestPaymentResponse {
  // The page the guest pays on.
  string url = 1;

  // The gateway that issued it: "razorpay".
  string gateway = 2;

  // The gateway's id for the link, which its webhook names.
  string gateway_reference = 3;

  // What it asks for.
  google.type.Money amount = 4;

  // When it lapses.
  google.protobuf.Timestamp expire_time = 5;
}

// Request message for ShareInvoice.
message ShareInvoiceRequest {
  // The invoice to share.
  // Format: venues/{venue}/invoices/{invoice}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.finance.v1/Invoice"
  ];

  // How long the link stands; 14 days when unset.
  google.protobuf.Duration ttl = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).duration = {
      gte: {seconds: 3600}
      lte: {seconds: 7776000}
    }
  ];
}

// Response message for ShareInvoice.
message ShareInvoiceResponse {
  // The link to send the guest: the guest site's page for the invoice, with
  // its signed token.
  string url = 1;

  // When it lapses.
  google.protobuf.Timestamp expire_time = 2;
}
