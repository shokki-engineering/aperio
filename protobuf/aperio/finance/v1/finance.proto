syntax = "proto3";

package aperio.finance.v1;

import "aperio/finance/v1/enums.proto";
import "aperio/type/v1/enums.proto";
import "aperio/type/v1/types.proto";
import "buf/validate/validate.proto";
import "entity/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/decimal.proto";
import "google/type/money.proto";
import "google/type/postal_address.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/finance/v1/financepbv1;financepbv1";
option java_multiple_files = true;
option java_outer_classname = "FinanceProto";
option java_package = "engineering.shokki.aperio.finance.v1";

// An Invoice is a GST document a venue issues: a tax invoice for what it
// supplied, a proforma before it, a receipt for an advance, or a credit note
// correcting an issued invoice.
//
// A draft is edited freely. IssueInvoice gives it the next number in the
// venue's series, dates it and fixes it: an issued invoice never changes, and
// a mistake in one is corrected by a credit note (CreditInvoice), as the law
// requires. Each line carries its HSN or SAC code and rate; the GST is split
// into CGST and SGST when the place of supply is in the venue's state, and
// charged as IGST when it is not.
message Invoice {
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    indexes: [
      {
        columns: ["number"]
        unique: true
      },
      {
        columns: [
          "state",
          "issue_date"
        ]
      }
    ]
  };

  option (google.api.resource) = {
    type: "aperio.finance.v1/Invoice"
    pattern: "venues/{venue}/invoices/{invoice}"
    singular: "invoice"
    plural: "invoices"
  };

  // The invoice name.
  // Format: venues/{venue}/invoices/{invoice}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^venues/[^/]+/invoices/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The invoice number in the venue's series for the financial year, e.g.
  // "SBR/2026-27/0042". Given by IssueInvoice; at most 16 characters, as GST
  // requires.
  string number = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.query) = {search: true}
  ];

  // What kind of GST document it is.
  InvoiceKind kind = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Lifecycle state, moved by the custom methods.
  State state = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.column) = {default_value: "DRAFT"}
  ];

  // Who is billed.
  // Format: contacts/{contact}
  string contact = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.guest.v1/Contact",
    (buf.validate.field).string.pattern = "^contacts/[^/]+$"
  ];

  // The buyer's GST registration, for a B2B invoice; empty for a consumer.
  aperio.type.v1.Gst buyer_gst = 6 [(google.api.field_behavior) = OPTIONAL];

  // The address billed to.
  google.type.PostalAddress billing_address = 7 [(google.api.field_behavior) = OPTIONAL];

  // The reservation or event invoiced.
  string booking = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "*"
  ];

  // The quote it was raised from, if any.
  // Format: venues/{venue}/quotes/{quote}
  string quote = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "aperio.sales.v1/Quote",
    (buf.validate.field).string.pattern = "^venues/[^/]+/quotes/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The invoice a credit note corrects. Set by CreditInvoice.
  // Format: venues/{venue}/invoices/{invoice}
  string corrects = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The GST state code of the place of supply: the venue's, for services
  // rendered at the venue.
  string supply_state_code = 11 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[0-9]{2}$"
  ];

  // The lines.
  repeated InvoiceLine lines = 12 [(google.api.field_behavior) = REQUIRED];

  // The taxable value of the lines.
  google.type.Money taxable_total = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Central GST, on an intra-state supply.
  google.type.Money cgst = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State GST, on an intra-state supply.
  google.type.Money sgst = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Integrated GST, on an inter-state supply.
  google.type.Money igst = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The invoice value: taxable value and GST, rounded to the rupee.
  google.type.Money total = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What has been paid against it, net of refunds.
  google.type.Money paid = 18 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What is still owed.
  google.type.Money due = 19 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The day it was issued. Set by IssueInvoice.
  google.type.Date issue_date = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The day payment is due.
  google.type.Date due_date = 21 [(google.api.field_behavior) = OPTIONAL];

  // The Invoice Reference Number the e-invoicing portal gave it, when the
  // venue is required to e-invoice.
  string irn = 22 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.query) = {search: true}
  ];

  // Notes printed on the invoice.
  string notes = 23 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 5000
  ];

  // Why it was cancelled. Set by CancelInvoice.
  string cancel_reason = 24 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 25 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 26 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 27 [(google.api.field_behavior) = OPTIONAL];

  // Where an invoice is in its life.
  enum State {
    // Default; never persisted.
    STATE_UNSPECIFIED = 0;

    // Being prepared; no number yet, and nothing is owed.
    STATE_DRAFT = 1;

    // Issued: numbered, dated and fixed.
    STATE_ISSUED = 2;

    // Issued and paid in full.
    STATE_PAID = 3;

    // Cancelled before it was reported; its number stays used.
    STATE_CANCELLED = 4;
  }
}

// InvoiceLine is one line of an invoice: what was supplied, its code, its
// taxable value and its GST.
message InvoiceLine {
  // What was supplied, as the invoice prints it.
  string description = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ];

  // The menu, fixed package, space, room or dish it is, when it is one.
  string item = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "*"
  ];

  // The HSN or SAC code and GST rate.
  aperio.type.v1.Tax tax = 3 [(google.api.field_behavior) = REQUIRED];

  // How many: plates, nights, hours, units.
  int32 quantity = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32.gt = 0
  ];

  // The price of one, before tax.
  google.type.Money unit_price = 5 [(google.api.field_behavior) = REQUIRED];

  // A discount on the line, before tax.
  google.type.Money discount = 6 [(google.api.field_behavior) = OPTIONAL];

  // quantity × unit_price, less the discount.
  google.type.Money taxable_value = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Central GST on the line.
  google.type.Money cgst = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State GST on the line.
  google.type.Money sgst = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Integrated GST on the line.
  google.type.Money igst = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A Payment is one movement of money between a venue and a guest: an advance
// through the payment gateway, a balance in cash at check-out, a bank
// transfer from a company, an amount a channel collected, or a refund.
//
// It is a ledger: payments are recorded, never edited away, and what a guest
// owes is what their invoices total less what their payments do. A payment
// may be in any currency; exchange_rate converts it to the venue's, and
// base_amount is what the books count.
//
// The gateway writes its payments itself, from its webhook; everything paid
// another way is recorded by staff.
message Payment {
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    indexes: [
      {
        columns: [
          "gateway",
          "gateway_reference"
        ]
        unique: true
      },
      {
        columns: [
          "state",
          "receive_time"
        ]
      }
    ]
  };

  option (google.api.resource) = {
    type: "aperio.finance.v1/Payment"
    pattern: "venues/{venue}/payments/{payment}"
    singular: "payment"
    plural: "payments"
  };

  // The payment name.
  // Format: venues/{venue}/payments/{payment}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^venues/[^/]+/payments/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Who paid, or was refunded.
  // Format: contacts/{contact}
  string contact = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.guest.v1/Contact",
    (buf.validate.field).string.pattern = "^contacts/[^/]+$"
  ];

  // The invoice paid against, if any.
  // Format: venues/{venue}/invoices/{invoice}
  string invoice = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "aperio.finance.v1/Invoice",
    (buf.validate.field).string.pattern = "^venues/[^/]+/invoices/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The reservation or event paid for.
  string booking = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "*"
  ];

  // Whether money came in or went out.
  PaymentKind kind = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // How it was paid.
  PaymentMethod method = 6 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The channel that collected it, for a CHANNEL payment.
  aperio.type.v1.Channel channel = 7 [(google.api.field_behavior) = OPTIONAL];

  // The amount, in the currency it was paid in.
  google.type.Money amount = 8 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Units of the venue's currency to one of the payment's; one when they are
  // the same.
  google.type.Decimal exchange_rate = 9 [(google.api.field_behavior) = OPTIONAL];

  // The amount in the venue's currency, as the books count it.
  google.type.Money base_amount = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where the payment is.
  State state = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.column) = {default_value: "PENDING"}
  ];

  // The payment gateway it went through, e.g. "razorpay", for a GATEWAY
  // payment.
  string gateway = 12 [(google.api.field_behavior) = OPTIONAL];

  // The gateway's id for it: what its webhook names, and what makes a
  // retried webhook find this payment instead of recording a second.
  string gateway_reference = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.query) = {search: true}
  ];

  // The reference of a payment made another way: a UTR, a cheque number, a
  // receipt number.
  string reference = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.query) = {search: true}
  ];

  // When the money was received, or paid out.
  google.protobuf.Timestamp receive_time = 15 [(google.api.field_behavior) = OPTIONAL];

  // Who recorded it; empty for the gateway.
  // Format: users/{user}
  string recorder = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "users.shokki.engineering/User",
    (store.v1.reference) = {on_delete: ON_DELETE_ALLOW},
    (buf.validate.field).string.pattern = "^users/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The payment a refund returns. Set by RefundPayment.
  // Format: venues/{venue}/payments/{payment}
  string refunds = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Anything else worth knowing.
  string notes = 18 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 5000
  ];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 19 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 21 [(google.api.field_behavior) = OPTIONAL];

  // Where a payment is.
  enum State {
    // Default; never persisted.
    STATE_UNSPECIFIED = 0;

    // Started, not yet settled: a gateway payment awaiting its webhook, a
    // cheque not yet cleared.
    STATE_PENDING = 1;

    // The money moved.
    STATE_SUCCEEDED = 2;

    // It did not go through.
    STATE_FAILED = 3;

    // Recorded in error and voided.
    STATE_VOIDED = 4;
  }
}
