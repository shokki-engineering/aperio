option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/catalog/v1/catalogpbv1;catalogpbv1";
option java_multiple_files = true;
option java_outer_classname = "CatalogMessagesProto";
option java_package = "engineering.shokki.aperio.catalog.v1";

// Request message for GetDish.
message GetDishRequest {
  // The name of the dish to retrieve.
  // Format: venues/{venue}/dishes/{dish}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.catalog.v1/Dish"
  ];
}

// Request message for ListDishes.
message ListDishesRequest {
  // The parent whose dishes to list.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.catalog.v1/Dish"
  ];

  // The maximum number of dishes to return; the server may
  // return fewer. Defaults to 50; at most 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListDishes call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter, e.g. course = COURSE_STARTER.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-132 ordering, e.g. "create_time desc".
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListDishes.
message ListDishesResponse {
  // The dishes.
  repeated Dish dishes = 1;

  // A token for the next page; empty on the last.
  string next_page_token = 2;
}

// Request message for CreateDish.
message CreateDishRequest {
  // The parent the dish is created under.
  // Format: venues/{venue}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "aperio.catalog.v1/Dish"
  ];

  // The dish to create.
  Dish dish = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to give it, the last segment of its name; the server mints one
  // when empty.
  string dish_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Validate the request without creating anything.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateDish.
message UpdateDishRequest {
  // The dish to update, by its name.
  Dish dish = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update; all populated fields when empty.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Validate the request without updating anything.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

