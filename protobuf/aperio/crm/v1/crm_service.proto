syntax = "proto3";

package aperio.crm.v1;

import "aperio/crm/v1/crm.proto";
import "aperio/crm/v1/crm_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "mcp/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/crm/v1/crmpbv1;crmpbv1";
option java_multiple_files = true;
option java_outer_classname = "CrmServiceProto";
option java_package = "engineering.shokki.aperio.crm.v1";

// CrmService: Contacts, and the sales pipeline of leads for stays and events with the activities logged on each.
service CrmService {
  option (google.api.default_host) = "aperio.shokki.engineering";
  option (mcp.v1.service) = {
    app: {
      display_name: "CRM"
      version: "1.0.0"
      description: "Contacts, and the sales pipeline of leads for stays and events with the activities logged on each."
    }
  };

  // Retrieves one contact.
  rpc GetContact(GetContactRequest) returns (Contact) {
    option (google.api.http) = {get: "/v1/{name=contacts/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists contacts.
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse) {
    option (google.api.http) = {get: "/v1/contacts"};
    option (google.api.method_signature) = "";
  }

  // Creates a contact.
  rpc CreateContact(CreateContactRequest) returns (Contact) {
    option (google.api.http) = {
      post: "/v1/contacts"
      body: "contact"
    };
    option (google.api.method_signature) = "contact,contact_id";
  }

  // Updates a contact. Only the fields in update_mask are written.
  rpc UpdateContact(UpdateContactRequest) returns (Contact) {
    option (google.api.http) = {
      patch: "/v1/{contact.name=contacts/*}"
      body: "contact"
    };
    option (google.api.method_signature) = "contact,update_mask";
  }

  // Deletes a contact.
  rpc DeleteContact(DeleteContactRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=contacts/*}"};
    option (google.api.method_signature) = "name";
  }

  // Retrieves one lead.
  rpc GetLead(GetLeadRequest) returns (Lead) {
    option (google.api.http) = {get: "/v1/{name=leads/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists leads.
  rpc ListLeads(ListLeadsRequest) returns (ListLeadsResponse) {
    option (google.api.http) = {get: "/v1/leads"};
    option (google.api.method_signature) = "";
  }

  // Creates a lead.
  rpc CreateLead(CreateLeadRequest) returns (Lead) {
    option (google.api.http) = {
      post: "/v1/leads"
      body: "lead"
    };
    option (google.api.method_signature) = "lead,lead_id";
  }

  // Updates a lead. Only the fields in update_mask are written.
  rpc UpdateLead(UpdateLeadRequest) returns (Lead) {
    option (google.api.http) = {
      patch: "/v1/{lead.name=leads/*}"
      body: "lead"
    };
    option (google.api.method_signature) = "lead,update_mask";
  }

  // Deletes a lead.
  rpc DeleteLead(DeleteLeadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=leads/*}"};
    option (google.api.method_signature) = "name";
  }

  // Retrieves one activity.
  rpc GetActivity(GetActivityRequest) returns (Activity) {
    option (google.api.http) = {get: "/v1/{name=leads/*/activities/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists activities.
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse) {
    option (google.api.http) = {get: "/v1/{parent=leads/*}/activities"};
    option (google.api.method_signature) = "parent";
  }

  // Creates an activity.
  rpc CreateActivity(CreateActivityRequest) returns (Activity) {
    option (google.api.http) = {
      post: "/v1/{parent=leads/*}/activities"
      body: "activity"
    };
    option (google.api.method_signature) = "parent,activity,activity_id";
  }

  // Updates an activity. Only the fields in update_mask are written.
  rpc UpdateActivity(UpdateActivityRequest) returns (Activity) {
    option (google.api.http) = {
      patch: "/v1/{activity.name=leads/*/activities/*}"
      body: "activity"
    };
    option (google.api.method_signature) = "activity,update_mask";
  }

  // Deletes an activity.
  rpc DeleteActivity(DeleteActivityRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=leads/*/activities/*}"};
    option (google.api.method_signature) = "name";
  }
}
