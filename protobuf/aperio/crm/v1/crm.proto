syntax = "proto3";

package aperio.crm.v1;

import "aperio/crm/v1/enums.proto";
import "aperio/type/v1/enums.proto";
import "aperio/type/v1/types.proto";
import "buf/validate/validate.proto";
import "entity/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/money.proto";
import "protobuf/opentravel/common/profile/v1/types/accesses.proto";
import "protobuf/opentravel/common/profile/v1/types/customer.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/shokki-engineering/aperio/protobuf/generated/go/crm/v1/crmpbv1;crmpbv1";
option java_multiple_files = true;
option java_outer_classname = "CrmProto";
option java_package = "engineering.shokki.aperio.crm.v1";

// A Contact is a person or a company aperio deals with: a guest, a couple
// booking their wedding, a company booking an offsite, an agent. Leads,
// bookings, quotes, invoices and payments all name one, so a guest who comes
// back is the same contact with their history.
//
// A person's name and address are OpenTravel's PersonName and Address, the
// shapes channels send guests in, so a booking from Booking.com fills a
// contact without translation.
message Contact {
  // Contacts are found by name, phone and email far more than by anything
  // else.
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    indexes: [
      {
        columns: ["update_time"]
      }
    ]
  };

  option (google.api.resource) = {
    type: "aperio.crm.v1/Contact"
    pattern: "contacts/{contact}"
    singular: "contact"
    plural: "contacts"
  };

  // The contact name.
  // Format: contacts/{contact}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^contacts/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Whether the contact is a person or a company.
  ContactKind kind = 2 [(google.api.field_behavior) = REQUIRED];

  // How the contact is shown and searched: a person's full name or a
  // company's name.
  string display_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (store.v1.query) = {search: true}
  ];

  // A person's name in parts -- title, given names, surname -- as OpenTravel
  // carries it (PersonName).
  protobuf.opentravel.common.profile.v1.types.PersonName name_parts = 4 [(google.api.field_behavior) = OPTIONAL];

  // The company a person works for, or the company itself.
  string company_display_name = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.query) = {search: true}
  ];

  // Phone numbers, the first the one to call.
  repeated aperio.type.v1.Phone phones = 6 [(google.api.field_behavior) = OPTIONAL];

  // Email addresses, the first the one to write to.
  repeated string emails = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.string.email = true
  ];

  // Postal addresses, as OpenTravel carries them.
  repeated protobuf.opentravel.common.profile.v1.types.Address addresses = 8 [(google.api.field_behavior) = OPTIONAL];

  // A business contact's GST registration: invoices to it are B2B and carry
  // its GSTIN.
  aperio.type.v1.Gst gst = 9 [(google.api.field_behavior) = OPTIONAL];

  // What the contact eats, carried onto every booking made for them.
  repeated aperio.type.v1.DietaryRequirement dietary_requirements = 10 [(google.api.field_behavior) = OPTIONAL];

  // Whether the contact agreed to receive offers.
  bool marketing_consent = 11 [(google.api.field_behavior) = OPTIONAL];

  // Free-form labels, e.g. "vip", "planner", "corporate".
  repeated string tags = 12 [(google.api.field_behavior) = OPTIONAL];

  // Anything else worth knowing.
  string notes = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 10000
  ];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 16 [(google.api.field_behavior) = OPTIONAL];

  // The E.164 numbers of phones, kept by the server from them: what a
  // caller, or a guest at the website, is found by.
  repeated string phone_numbers = 17 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.query) = {search: true}
  ];
}

// A Lead is an enquiry that may become a booking: a couple asking about a
// December wedding, a company asking for an offsite with forty rooms, a
// family asking about a week at the resort. It covers both venues and every
// kind of booking -- a stay, an event, or both, as a wedding with rooms for
// its guests is.
//
// A lead moves through a sales pipeline, from NEW to WON or LOST, owned by
// one salesperson with a follow-up date. While it is negotiated its dates
// can be held in freebusy (`hold`), so they are not sold under it; winning it
// turns the accepted quote into the booking.
message Lead {
  // The pipeline is read by stage and owner, and worked by follow-up date.
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    indexes: [
      {
        columns: [
          "stage",
          "next_follow_up_time"
        ]
      },
      {
        columns: [
          "owner",
          "stage"
        ]
      },
      {
        columns: ["update_time"]
      }
    ]
  };

  option (google.api.resource) = {
    type: "aperio.crm.v1/Lead"
    pattern: "leads/{lead}"
    singular: "lead"
    plural: "leads"
  };

  // The lead name.
  // Format: leads/{lead}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^leads/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // A short title for the pipeline, e.g. "Sharma–Iyer wedding, Dec 2026".
  string display_name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (store.v1.query) = {search: true}
  ];

  // Who is asking.
  // Format: contacts/{contact}
  string contact = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "aperio.crm.v1/Contact",
    (buf.validate.field).string.pattern = "^contacts/[^/]+$"
  ];

  // The venue asked about; empty while the guest is still choosing.
  // Format: venues/{venue}
  string venue = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "aperio.venue.v1/Venue",
    (buf.validate.field).string.pattern = "^venues/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // What the guest wants to book.
  LeadKind kind = 5 [(google.api.field_behavior) = REQUIRED];

  // The occasion, for an event.
  aperio.type.v1.EventType event_type = 6 [(google.api.field_behavior) = OPTIONAL];

  // Where the lead came from.
  aperio.type.v1.Channel source = 7 [(google.api.field_behavior) = OPTIONAL];

  // More on the source: the campaign, the referrer, the agent.
  string source_detail = 8 [(google.api.field_behavior) = OPTIONAL];

  // Where the lead is in the pipeline.
  Stage stage = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.column) = {default_value: "NEW"}
  ];

  // The dates asked for, in order of preference.
  repeated aperio.type.v1.DateRange dates = 10 [(google.api.field_behavior) = OPTIONAL];

  // Whether the guest would take other dates.
  bool dates_flexible = 11 [(google.api.field_behavior) = OPTIONAL];

  // How many guests are expected.
  int32 guests = 12 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // How many rooms are wanted, for a stay or an event's guests.
  int32 rooms = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // What the guest means to spend, in all.
  google.type.Money budget = 14 [(google.api.field_behavior) = OPTIONAL];

  // What the guest needs that the rest does not say: decor, a mandap, a band,
  // a vegetarian-only kitchen.
  string requirements = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 10000
  ];

  // The salesperson who owns the lead.
  // Format: users/{user}
  string owner = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "users.shokki.engineering/User",
    (store.v1.reference) = {on_delete: ON_DELETE_ALLOW},
    (buf.validate.field).string.pattern = "^users/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // When the owner is next to get in touch.
  google.protobuf.Timestamp next_follow_up_time = 17 [(google.api.field_behavior) = OPTIONAL];

  // Why the lead was lost, once it is.
  LostReason lost_reason = 18 [(google.api.field_behavior) = OPTIONAL];

  // More on why it was lost: the competitor, the price asked for.
  string lost_detail = 19 [(google.api.field_behavior) = OPTIONAL];

  // The freebusy hold keeping the lead's first dates while it is negotiated.
  // Format: holds/{hold}
  string hold = 20 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "freebusy.allocation.v1/Hold"
  ];

  // The bookings the lead became, once won.
  repeated string bookings = 21 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the lead was won or lost.
  google.protobuf.Timestamp close_time = 22 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 23 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 24 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 25 [(google.api.field_behavior) = OPTIONAL];
}

// An Activity is one touch on a lead: a call, a WhatsApp, a site visit, a
// quote sent. The activities of a lead are its history, newest first.
message Activity {
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  option (google.api.resource) = {
    type: "aperio.crm.v1/Activity"
    pattern: "leads/{lead}/activities/{activity}"
    singular: "activity"
    plural: "activities"
  };

  // The activity name.
  // Format: leads/{lead}/activities/{activity}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^leads/[^/]+/activities/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // What happened.
  ActivityKind kind = 2 [(google.api.field_behavior) = REQUIRED];

  // When it happened.
  google.protobuf.Timestamp occur_time = 3 [(google.api.field_behavior) = REQUIRED];

  // What was said or done, in a line.
  string summary = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ];

  // The rest of it.
  string details = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 10000
  ];

  // Who did it.
  // Format: users/{user}
  string author = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "users.shokki.engineering/User",
    (store.v1.reference) = {on_delete: ON_DELETE_ALLOW},
    (buf.validate.field).string.pattern = "^users/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154).
  string etag = 9 [(google.api.field_behavior) = OPTIONAL];
}
