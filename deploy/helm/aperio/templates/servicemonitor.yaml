# For the Prometheus Operator: scrapes GET /metrics on the http port, which
# the server serves while server.metrics is on (values.yaml).
{{- if and .Values.serviceMonitor.enabled (not .Values.server.metrics) }}
{{- fail "serviceMonitor.enabled needs server.metrics: without it there is no /metrics to scrape" }}
{{- end }}
{{- with .Values.serviceMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "aperio.fullname" $ }}
  labels:
    {{- include "aperio.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "aperio.serverSelector" $ | nindent 6 }}
  endpoints:
    - port: {{ .port }}
      path: {{ .path }}
      interval: {{ .interval }}
      scrapeTimeout: {{ .scrapeTimeout }}
{{- end }}
{{- end }}
