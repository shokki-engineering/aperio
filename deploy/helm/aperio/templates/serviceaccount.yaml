# The server's identity; it holds no token (the pods do not mount one), and
# exists for workload identity annotations (cloud IAM) and policy.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aperio.serviceAccountName" . }}
  labels:
    {{- include "aperio.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
