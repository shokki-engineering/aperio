# The chart's Secret, when no existingSecret is named: the values set, and
# nothing for the ones left empty (the pods read every key but
# postgres-password as optional). values.yaml lists the keys.
{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- $keys := dict
  "database-url" $s.databaseUrl
  "hasura-admin-secret" $s.hasuraAdminSecret
  "concierge-hold-secret" $s.conciergeHoldSecret
  "opensearch-username" $s.opensearchUsername
  "opensearch-password" $s.opensearchPassword
  "freebusy-feeds-secret" $s.freebusyFeedsSecret
  "freebusy-ca.crt" $s.freebusyCA
  "redis-password" $s.redisPassword
  "auth-link-secret" $s.authLinkSecret
  "notify-webhook-secret" $s.notifyWebhookSecret
  "razorpay-key-id" $s.razorpayKeyId
  "razorpay-key-secret" $s.razorpayKeySecret
  "razorpay-webhook-secret" $s.razorpayWebhookSecret
  "bookingcom-username" $s.bookingcomUsername
  "bookingcom-password" $s.bookingcomPassword
  "freebusy-webhook-secret" $s.freebusyWebhookSecret
  "whatsapp-token" $s.whatsappToken }}
{{- if and .Values.freebusy.ca.enabled (not $s.freebusyCA) }}
{{- fail "freebusy.ca.enabled needs secrets.freebusyCA (or an existingSecret with freebusy-ca.crt)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aperio.fullname" . }}
  labels:
    {{- include "aperio.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword (or secrets.existingSecret) is required" $s.postgresPassword | quote }}
  {{- range $k, $v := $keys }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
