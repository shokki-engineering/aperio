# aperio's local development database: Postgres holding the aperio database,
# which Prisma migrates (`just db migrate`) and Hasura DDN serves
# (deploy/hasura, `just hasura regen`).
#
#   docker compose -f deploy/compose/compose.yaml up -d
#
# On 127.0.0.1:5433, so it runs beside another project's Postgres on 5432.
# Nothing here is for production.

name: aperio

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ota
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ota"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres:
