# The one Hasura DDN engine aperio and freebusy share (CLAUDE.md, "Shared
# Postgres and Hasura"), and both apps' Postgres connectors, over the shared
# dev Postgres (127.0.0.1:5433, a database each). All publish on 127.0.0.1.
#
#   just hasura build    # the supergraph, freebusy's subgraph included
#   just hasura engine   # start (or restart) the engine and connectors
#
# The engine answers on http://localhost:3280/graphql, aperio's connector on
# :9795 and freebusy's on :9794.
#
# freebusy's subgraph is its published image (freebusy: `just hasura
# subgraph-image`), copied into the freebusy-subgraph volume: the supergraph
# build mounts it at ./freebusy, and freebusy's connector reads its
# configuration from it, so nothing of freebusy's is kept in this repository.

include:
  - path: aperio/connector/aperio_pgsql/compose.yaml
services:
  engine:
    build:
      context: engine
      dockerfile: Dockerfile.engine
      pull: true
    environment:
      AUTHN_CONFIG_PATH: /md/auth_config.json
      ENABLE_CORS: "true"
      ENABLE_SQL_INTERFACE: "true"
      INTROSPECTION_METADATA_FILE: /md/metadata.json
      METADATA_PATH: /md/open_dd.json
      OTLP_ENDPOINT: http://local.hasura.dev:6009
    extra_hosts:
      - local.hasura.dev:host-gateway
    labels:
      io.hasura.ddn.service-name: engine
    ports:
      - 127.0.0.1:3280:3000

  # freebusy's connector: the image its own repository builds the connector
  # from, with the configuration its subgraph image carries.
  freebusy_freebusy_pgsql:
    image: ghcr.io/hasura/ndc-postgres:v3.1.0
    depends_on:
      freebusy-subgraph:
        condition: service_completed_successfully
    environment:
      CONNECTION_URI: $FREEBUSY_FREEBUSY_PGSQL_CONNECTION_URI
      HASURA_SERVICE_TOKEN_SECRET: $FREEBUSY_FREEBUSY_PGSQL_HASURA_SERVICE_TOKEN_SECRET
      OTEL_EXPORTER_OTLP_ENDPOINT: $FREEBUSY_FREEBUSY_PGSQL_OTEL_EXPORTER_OTLP_ENDPOINT
      OTEL_SERVICE_NAME: $FREEBUSY_FREEBUSY_PGSQL_OTEL_SERVICE_NAME
    extra_hosts:
      - local.hasura.dev:host-gateway
    ports:
      - 127.0.0.1:9794:8080
    volumes:
      - type: volume
        source: freebusy-subgraph
        target: /etc/connector
        read_only: true
        volume:
          subpath: connector/freebusy_pgsql

  # Copies freebusy's subgraph image into the volume, replacing what an older
  # one left. FREEBUSY_SUBGRAPH_TAG picks freebusy's release (default the one
  # aperio is built against); "latest" is a local `just hasura
  # subgraph-image` in freebusy, as pre-releases don't move :latest.
  freebusy-subgraph:
    image: ghcr.io/shokki-engineering/freebusy-subgraph:${FREEBUSY_SUBGRAPH_TAG:-1.0.0-rc.2.1}
    pull_policy: missing
    volumes:
      - freebusy-subgraph:/out

  # `ddn supergraph build local` over this directory, with freebusy's subgraph
  # mounted where supergraph.yaml looks for it; writes engine/build.
  supergraph:
    profiles: [build]
    build: builder
    platform: linux/amd64
    depends_on:
      freebusy-subgraph:
        condition: service_completed_successfully
    volumes:
      - .:/project
      - freebusy-subgraph:/project/freebusy:ro
      # The DDN CLI wants a login even to build locally: the host's (`ddn auth
      # login`), read-only, so no token is ever kept in an image.
      - ${HOME}/.ddn/config.yaml:/root/.ddn/config.yaml:ro
    command: [supergraph, build, local, --output-dir, engine/build, --env-file, .env, --no-prompt]

volumes:
  freebusy-subgraph:
