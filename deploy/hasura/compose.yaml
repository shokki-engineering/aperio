# The Hasura DDN engine serving the ota database, and its Postgres connector.
#
#   ddn run docker-start -- -d        # or: just hasura regen
#
# The engine answers on http://localhost:3281/graphql and the connector on
# :9795 -- beside another project's engine on 3280 and connector on 9794.

include:
  - path: aperio/connector/aperio_pgsql/compose.yaml
services:
  engine:
    build:
      context: engine
      dockerfile: Dockerfile.engine
      pull: true
    environment:
      AUTHN_CONFIG_PATH: /md/auth_config.json
      ENABLE_CORS: "true"
      ENABLE_SQL_INTERFACE: "true"
      INTROSPECTION_METADATA_FILE: /md/metadata.json
      METADATA_PATH: /md/open_dd.json
      OTLP_ENDPOINT: http://local.hasura.dev:6009
    extra_hosts:
      - local.hasura.dev:host-gateway
    labels:
      io.hasura.ddn.service-name: engine
    ports:
      - 3281:3000
