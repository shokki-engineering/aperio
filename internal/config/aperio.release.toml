# aperio's production defaults, compiled into the binary. Secrets are blank:
# a deployment sets them through APERIO_<SECTION>__<KEY> variables, e.g.
# APERIO_DATABASE__POSTGRES__PASSWORD. The development profile,
# aperio.dev.toml, is layered over this one (see load.go).

[app]
name = "aperio"
version = "v0.1.0"
description = "Venue backend: stays, events, leads, quotes, GST invoices and payments, booked through freebusy."

[server]
# development | debug | staging | production
environment = "production"
enable_http = true
enable_health = true
enable_mcp = true
experimental_http3 = false
# How long Stop waits for HTTP and gRPC to drain; 0 takes runtime-go's default.
shutdown_timeout_seconds = 20

# Beside freebusy's 50051 / 8080 / 8081, so both run on one machine.
[server.grpc]
host = "0.0.0.0"
port = 50061

[server.http]
host = "0.0.0.0"
port = 8090

[server.mcp]
host = "0.0.0.0"
port = 8091
transport = "streamable-http"
# Every service's MCP tools together, at one path an agent connects to.
path = "/mcp"
stateless = true

# Browsers on other origins calling the HTTP port (the REST gateway). Off.
[server.cors]
enabled = false
allowed_origins = []
allowed_methods = []
allowed_headers = []
exposed_headers = []
allow_credentials = false
max_age_seconds = 600

[server.tls]
cert_file = ""
key_file = ""

[database]
# gorm: Postgres directly; hasura: through the DDN engine.
provider = "gorm"

[database.postgres]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = ""
dbname = "aperio"
sslmode = "require"
timezone = "UTC"
max_open_conns = 25
max_idle_conns = 25
conn_max_lifetime_minutes = 30
conn_max_idle_minutes = 5
plan_cache_mode = "force_custom_plan"

[database.hasura]
url = ""
admin_secret = ""

[cache]
enabled = false
address = "127.0.0.1:6379"
username = ""
password = ""
database = 0
pool_size = 0
prefix = "aperio"

[freebusy]
endpoint = ""
insecure = false
ca_file = ""
timeout_seconds = 10
public_url = ""
feeds_secret = ""

[concierge]
# Seals hold tokens; set through APERIO_CONCIERGE__HOLD_SECRET. Empty, each
# process makes its own.
hold_secret = ""

[search]
# The read models -- one row per night of every stay (stay.v1.StayNight), and
# those to come -- that summaries, reports and agents read instead of every
# record, kept current in the same transaction as every write to their
# sources. Where they are searched: "postgres" (their own tables) or
# "opensearch" (a copy kept by a change-feed indexer, see [search.opensearch];
# any error or timeout falls back to Postgres).
provider = "postgres"
# When the server recomputes a read model as it starts (in the background; it
# serves meanwhile): "empty" when its table has no rows -- a fresh deployment,
# or an upgrade from a version without it; "always" on every start -- the
# repair after writes that bypassed the API: restart with it set, then set it
# back; "never".
rebuild_on_start = "empty"

[search.opensearch]
# The cluster, used only when provider = "opensearch". Credentials are
# secrets: set APERIO_SEARCH__OPENSEARCH__USERNAME / __PASSWORD.
url = ""
username = ""
password = ""
# Committed changes buffered for an indexer before writes wait on it.
index_queue = 1024
# A search slower than this falls back to Postgres, in milliseconds.
timeout_ms = 500
# When the server reloads an index from its read model's table as it starts
# (in the background: a new versioned index, then an alias swap): "empty" when
# the index has no documents but the table has rows; "always" on every start
# -- the repair after an indexer missed changes: restart one replica with it
# set, then set it back; "never".
reindex_on_start = "empty"

[notify]
# Who departments and guests are told through: "log" (the default), "webhook"
# (a JSON POST signed X-Aperio-Signature: sha256=HMAC of the body) or
# "whatsapp" (the WhatsApp Business Cloud API). Secrets through
# APERIO_NOTIFY__WEBHOOK__SECRET and APERIO_NOTIFY__WHATSAPP__TOKEN.
provider = "log"
timeout_seconds = 10

[notify.departments]
# Where each department is told -- pantry, kitchen, housekeeping, maintenance,
# it_av, front_desk, banquet, security -- or "default": a webhook URL or a
# WhatsApp number, as the provider takes.

[notify.webhook]
url = ""
secret = ""

[notify.whatsapp]
api_url = ""
phone_number_id = ""
token = ""
template = ""
language = "en"

[auth]
# Staff sign-in: any OIDC issuer (Google Workspace, Keycloak, Clerk). Empty
# issuer turns auth off, with a loud warning -- development only.
# APERIO_AUTH__ISSUER, APERIO_AUTH__AUDIENCE.
issuer = ""
audience = ""
# The claims carrying a person's roles (owner, front_desk, sales, kitchen,
# housekeeping, accounts) and venues ("venues/x", or "*" for all); a dotted
# path such as realm_access.roles works.
roles_claim = "roles"
venues_claim = "venues"
clock_skew_seconds = 60
# Signs guests' read-only links to a quote, stay or invoice: 32+ random
# bytes, the same on every replica; APERIO_AUTH__LINK_SECRET.
link_secret = ""

[auth.role_map]
# The issuer's group names to aperio's roles, e.g. "aperio-kitchen" = "kitchen".

[channels.bookingcom]
# Booking.com over OTA XML: serves POST /channels/bookingcom/reservations
# (OTA_HotelResNotifRQ), with HTTP basic auth through
# APERIO_CHANNELS__BOOKINGCOM__USERNAME / __PASSWORD -- with either empty,
# every message is refused.
enabled = false
username = ""
password = ""
# Each hotel code Booking.com sends, the venue it is, and its room types:
# [[channels.bookingcom.hotels]]
# hotel_code = "7777001"
# venue = "venues/<id>"
# [[channels.bookingcom.hotels.rooms]]
# code = "SV-DLX"
# space = "venues/<id>/spaces/<id>"
# rate_plan = "BAR"

[razorpay]
# The payment gateway for Indian cards and UPI: refunds, payment links
# (RequestPayment) and its webhook at POST /webhooks/razorpay. Off while
# key_id is empty. Secrets through APERIO_RAZORPAY__KEY_ID, __KEY_SECRET and
# __WEBHOOK_SECRET.
base_url = ""  # https://api.razorpay.com/v1 when empty
key_id = ""
key_secret = ""
webhook_secret = ""
timeout_seconds = 15

[freebusy_sync]
# The public URL freebusy POSTs its changes to: aperio's REST port and
# /webhooks/freebusy. Empty, no subscription is made (the reconciler still
# runs).
webhook_url = ""
webhook_id = "aperio"
# The subscription's whsec_ signing secret, as freebusy's CreateWebhook or
# RotateWebhookSecret returned it: APERIO_FREEBUSY_SYNC__WEBHOOK_SECRET.
webhook_secret = ""
# How often the reconciler walks the live bookings (0 is five minutes) and
# sent quotes are expired (0 is a minute); below 0 turns a job off.
reconcile_interval_seconds = 0
quote_expiry_interval_seconds = 0
