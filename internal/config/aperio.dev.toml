# The development profile, layered over aperio.release.toml: the local stack
# (`just db up`, `just hasura` and a freebusy from its own checkout). Read
# from this file in a checkout, so edits apply without a rebuild.

[app]
name = "aperio"
version = "v0.1.0"

[server]
environment = "debug"
enable_http = true
enable_health = true
enable_mcp = true

[database]
provider = "gorm"

[database.postgres]
host = "127.0.0.1"
port = 5433
user = "postgres"
password = "postgrespassword"
dbname = "aperio"
sslmode = "disable"
timezone = "UTC"

[database.hasura]
url = "http://localhost:3280/graphql"

[cache]
enabled = false
address = "127.0.0.1:6379"
prefix = "aperio-dev"

# freebusy's dev server (`just run` in its checkout) serves TLS with mkcert's
# certificate: point ca_file at `$(mkcert -CAROOT)/rootCA.pem`, or set
# insecure when it runs without TLS.
[freebusy]
endpoint = "localhost:50051"
insecure = false
ca_file = ""
public_url = "http://localhost:8080"
feeds_secret = ""

[concierge]
# Seals hold tokens; set through APERIO_CONCIERGE__HOLD_SECRET. Empty, each
# process makes its own.
hold_secret = ""
# The share of a confirmed stay's proforma, taxes included, asked as its
# advance through the payment link: 1 to 100 (anything else is 100).
advance_percent = 100

[auth]
# The local guest site guests' links open.
link_base_url = "http://localhost:3000"
