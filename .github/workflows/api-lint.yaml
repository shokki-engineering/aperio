# Google AIP lint of aperio's protos, as `just lint` runs it: api-linter over
# the buf-built descriptor set, with api-linter.yaml's one disabled rule
# (core::0215::foreign-type-reference, which importing OpenTravel's types
# requires). Any other finding fails.

name: API lint

on:
  push:
    branches: [main]
  # No `branches` filter: gate every PR, whatever branch it targets.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aip:
    name: Google AIP lint (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: go install github.com/googleapis/api-linter/v2/cmd/api-linter@v2.3.1
      - run: just lint
