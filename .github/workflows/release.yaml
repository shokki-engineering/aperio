# A release is a tag: v1.2.3 publishes, under 1.2.3,
#
#   ghcr.io/shokki-engineering/aperio                the server (amd64 + arm64)
#   ghcr.io/shokki-engineering/aperio-migrate        Prisma and the migrations
#   oci://ghcr.io/shokki-engineering/charts/aperio   the Helm chart
#
# and a GitHub release whose notes are the tag's CHANGELOG.md section, with
# the chart attached. CI's checks are not repeated here: tag a commit main
# already passed.
#
# The images are built and pushed by Bazel (rules_oci, deploy/image), the
# binary and the labels stamped with the tag and commit. Each image carries
# GitHub's SLSA build provenance and, per platform, an SPDX SBOM (syft)
# attested with cosign; everything is signed keylessly with cosign
# (Sigstore, through this run's GitHub OIDC identity): each image by digest,
# the chart in the registry, and the release's files (a .sigstore.json
# bundle beside each).
#
# A tag with a pre-release part (v1.0.0-rc.1) publishes the same artifacts
# under its version, does not move the images' `latest` tag, and is marked a
# pre-release on GitHub.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Releases queue rather than cancel: stopping one part-way would leave some
# artifacts published and others not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  # Keyless signing: cosign gets a short-lived certificate for this run from
  # Sigstore through GitHub's OIDC token. No signing key to keep.
  id-token: write
  # The images' build provenance (actions/attest-build-provenance).
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      REGISTRY: ghcr.io/shokki-engineering
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version the server reports is config: the tag must match it, and
      # CHANGELOG.md must have the tag's section.
      - name: Tag matches the release config and the changelog
        run: |
          version="${TAG#v}"
          grep -qxF "version = \"v$version\"" internal/config/aperio.release.toml ||
            { echo "::error::internal/config/aperio.release.toml [app] version is not v$version"; exit 1; }
          awk -v h="## [$version]" 'index($0, h) == 1 {found=1} END {exit !found}' CHANGELOG.md ||
            { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # cosign signs and attests; crane resolves a pushed tag to its digest
      # (and each platform's); syft writes the SBOMs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Both indexes (linux/amd64 + linux/arm64), under the version and,
      # unless a pre-release, latest. --config=release stamps the tag and
      # commit (tools/bazel/status.sh) into the binary (`aperio --version`)
      # and both images' version and revision labels.
      - name: Server and migrate images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tags=(--tag "$VERSION")
          if [ "$PRERELEASE" != true ]; then tags+=(--tag latest); fi
          bazel run --config=release //deploy/image:push -- "${tags[@]}"
          bazel run --config=release //deploy/image:push_migrate -- "${tags[@]}"
          echo "SERVER_DIGEST=$(crane digest "$REGISTRY/aperio:$VERSION")" >> "$GITHUB_ENV"
          echo "MIGRATE_DIGEST=$(crane digest "$REGISTRY/aperio-migrate:$VERSION")" >> "$GITHUB_ENV"

      - name: Server provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/aperio
          subject-digest: ${{ env.SERVER_DIGEST }}
          push-to-registry: true
      - name: Migrate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/aperio-migrate
          subject-digest: ${{ env.MIGRATE_DIGEST }}
          push-to-registry: true

      # One SBOM per platform image, attested to that image's digest, as
      # BuildKit attached them.
      - name: SBOMs
        run: |
          for name in aperio aperio-migrate; do
            for platform in linux/amd64 linux/arm64; do
              digest="$(crane digest --platform "$platform" "$REGISTRY/$name:$VERSION")"
              syft "registry:$REGISTRY/$name@$digest" -o spdx-json=sbom.spdx.json
              cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REGISTRY/$name@$digest"
            done
          done

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm chart
        run: |
          # Artifact Hub: the images at this version, and the pre-release flag.
          IMAGES="$(printf -- '- name: aperio\n  image: %s/aperio:%s\n- name: aperio-migrate\n  image: %s/aperio-migrate:%s\n' \
            "$REGISTRY" "$VERSION" "$REGISTRY" "$VERSION")" PRERELEASE="$PRERELEASE" yq -i '
              .annotations."artifacthub.io/images" = strenv(IMAGES) |
              .annotations."artifacthub.io/prerelease" = strenv(PRERELEASE)
            ' deploy/helm/aperio/Chart.yaml
          helm lint --strict deploy/helm/aperio -f deploy/helm/aperio/ci/full-values.yaml
          helm package deploy/helm/aperio --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/aperio-$VERSION.tgz" "oci://$REGISTRY/charts" 2>&1 | tee push.log
          digest="$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | head -1)"
          [ -n "$digest" ] || { echo "::error::helm push printed no digest"; exit 1; }
          echo "CHART_DIGEST=$digest" >> "$GITHUB_ENV"

      # Every image (each platform too, --recursive) and the chart, signed by
      # digest.
      - name: Sign images and chart
        run: |
          cosign sign --yes --recursive "$REGISTRY/aperio@$SERVER_DIGEST"
          cosign sign --yes --recursive "$REGISTRY/aperio-migrate@$MIGRATE_DIGEST"
          cosign sign --yes "$REGISTRY/charts/aperio@$CHART_DIGEST"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          assets=("dist/aperio-$VERSION.tgz")
          for f in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            assets+=("$f.sigstore.json")
          done
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "${flags[@]}" "${assets[@]}"
