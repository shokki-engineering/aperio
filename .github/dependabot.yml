# Dependabot: version updates for the Go module, the workflows' actions and
# the Prisma package. The images' pins -- the Bazel modules, the Node base's
# digest and the Prisma CLI's lockfile and schema engine (MODULE.bazel,
# deploy/image/prisma, `just prisma-lock`) -- move by hand. Security updates are
# switched on in the repository's settings and arrive whatever the schedule
# says. workflows/dependabot-auto-merge.yaml merges each pull request once
# the required CI checks pass.
#
# Minor and patch updates are grouped, one pull request per ecosystem a week;
# a major update comes alone, so its failure names it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Released from one repository; they expect each other's versions.
      runtime-go:
        patterns: ["github.com/the-protobuf-project/runtime-go/*"]
      # The SDK and API are released together; a partial bump does not build.
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      gomod:
        update-types: [minor, patch]
    ignore:
      # The BSR SDKs move with the protos (buf.lock) and a regeneration
      # (`just gen`), never alone.
      - dependency-name: "buf.build/gen/go/*"
      # Generator libraries: the committed code names the plugin versions it
      # was made with (and ci.yaml's drift check installs those); they move
      # with a regeneration.
      - dependency-name: "github.com/the-protobuf-project/mcp"
      - dependency-name: "github.com/the-protobuf-project/store"
      - dependency-name: "github.com/the-protobuf-project/service"
      - dependency-name: "github.com/the-protobuf-project/cache"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  # The migrate image's Prisma CLI (deploy/image/prisma): its lockfile is
  # hand-owned and pins what tools/bazel/prisma.bzl downloads. After a bump,
  # `just prisma-lock` and the schema engine hashes in MODULE.bazel move too.
  # The generated package in protobuf/generated/prisma is never a target:
  # it is protoc-gen-store's output, and CI's drift check fails on any edit
  # to it -- newer versions there come from the generator.
  - package-ecosystem: npm
    directory: /deploy/image/prisma
    schedule:
      interval: weekly
      day: monday
