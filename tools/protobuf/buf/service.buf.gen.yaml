# protoc-gen-service: the AIP standard-method service layer over the generated
# repositories -- one gRPC server per service with a hooks interface for the
# business logic, RegisterAll for gRPC, REST and MCP, and the error reasons.
# Run via `just gen service`, after `store` (whose repositories the servers
# persist through) and `ota` (whose gateway and MCP bindings they register).
version: v2
clean: true
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
  override:
    # The OTA messages are the BSR SDK's; see store.buf.gen.yaml.
    - file_option: go_package_prefix
      value: buf.build/gen/go/shokki-engineering/protobuf-ota/protocolbuffers/go
      module: buf.build/shokki-engineering/protobuf-ota
inputs:
  # Pinned to the same commit as store.buf.gen.yaml and ota.buf.gen.yaml.
  - module: buf.build/shokki-engineering/protobuf-ota:bb88093022b144c89092c9fba49c744d
plugins:
  - local: protoc-gen-service
    out: internal/service/generated
    strategy: all
    opt:
      - go_module=github.com/shokki-engineering/aperio/internal/service/generated
      - repository_module=github.com/shokki-engineering/aperio/internal/database/repository
      - config=tools/protobuf/buf/config/service.yaml
      - error_domain=aperio.dev
