# Transport bindings for protobuf-ota: the HTTP gateway and MCP servers for
# every service the module defines. Run via `just gen ota`.
#
# The messages and gRPC stubs are NOT generated here. aperio uses the SDK the
# BSR publishes for the module --
#
#   buf.build/gen/go/shokki-engineering/protobuf-ota/protocolbuffers/go   (messages)
#   buf.build/gen/go/shokki-engineering/protobuf-ota/grpc/go              (gRPC)
#
# -- so the store, the servers and any client share one copy of each type: a
# local copy of the same protos would register the same .proto files a second
# time, which protobuf-go refuses at init. Keep the module pin below on the
# commit the SDK versions in go.mod were cut from.
#
# go_package_prefix reproduces the SDK's own import paths, so the bindings
# import exactly the SDK packages. Each plugin then writes into a sub-package of
# its own beside them -- grpc-gateway's standalone mode, protoc-gen-mcp's
# package_suffix -- since a package of a module aperio does not own cannot gain
# files. `module=` strips the SDK prefix so the output lands under
# protobuf/generated/go/ota/.
version: v2
clean: true
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: buf.build/gen/go/shokki-engineering/protobuf-ota/protocolbuffers/go
      module: buf.build/shokki-engineering/protobuf-ota
inputs:
  - module: buf.build/shokki-engineering/protobuf-ota:bb88093022b144c89092c9fba49c744d
plugins:
  - remote: buf.build/grpc-ecosystem/gateway:v2.27.4
    out: protobuf/generated/go/ota
    opt:
      - module=buf.build/gen/go/shokki-engineering/protobuf-ota/protocolbuffers/go
      - standalone=true
  - local: protoc-gen-mcp
    out: protobuf/generated/go/ota
    opt:
      - lang=go
      - module=buf.build/gen/go/shokki-engineering/protobuf-ota/protocolbuffers/go
      - package_suffix=mcp
