# protoc-gen-store, target=prisma: the Prisma schema of the ota database --
# one .prisma file per table under a folder per schema, the Prisma 7 config
# (ota.config.ts) and its package.json. Prisma owns the migrations
# (`just db migrate`), and Hasura introspects the database they build.
# Run via `just gen prisma`.
#
# clean: false, unlike the other templates: protobuf/generated/prisma/ota/
# migrations is Prisma's history, written by `prisma migrate dev`, and buf's
# clean would wipe it. The recipe deletes the generated files itself, keeping
# migrations/, node_modules/ and .env.
version: v2
clean: false
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: buf.build/gen/go/shokki-engineering/protobuf-ota/protocolbuffers/go
      module: buf.build/shokki-engineering/protobuf-ota
inputs:
  # Pinned to the same commit as store.buf.gen.yaml.
  - module: buf.build/shokki-engineering/protobuf-ota:bb88093022b144c89092c9fba49c744d
plugins:
  - local: protoc-gen-store
    out: protobuf/generated/prisma
    strategy: all
    opt:
      - target=prisma
      - config=tools/protobuf/buf/config/store.backend.yaml
