# protoc-gen-cache's configuration: the layout block of store.backend.yaml,
# repeated, because the cache plugin decodes its config strictly and
# store.backend.yaml carries settings only protoc-gen-store reads. What is
# cached, and how, is in the protos' (cache.v1.cache) annotations.

strip_version: true
dedupe_schema_table: true

datasources:
  # aperio's own protos, one database with a schema per package:
  # aperio.booking.v1 -> schema "booking". Every leaf is one word, as the
  # graphql target needs (it splits DDN's PascalCase schema+table names at the
  # first token).
  - match: "aperio.**"
    database: aperio
    schema: "{leaf}"

# Message types stored whole: a field of one is a JSONB column holding the
# message's JSON form (an array, when repeated), not a table of its own.
#
#   protobuf.opentravel.**  the OpenTravel vocabulary aperio imports -- room
#                           stays, guests, hotel information -- kept as a
#                           channel sends it, however deep it nests.
#   aperio.**               aperio's own value objects: lines, requirements,
#                           requests, capacities. A resource is never a
#                           field's type (resources reference each other by
#                           name), so this names value objects only.
#   google.type.**          Money, PostalAddress. The single-column well-known
#                           types (Date, Decimal, DayOfWeek) keep their column.
#
# What is searched and reported on is a top-level field of the resource, and
# so a column of its own.
documents:
  - match: "protobuf.opentravel.**"
  - match: "aperio.**"
  - match: "google.type.**"
